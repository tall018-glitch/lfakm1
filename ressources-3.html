<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressources pédagogiques — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A; --ink-deep: #10192E; --paper: #F7F5F0; --brass: #A8853F;
    --slate: #5B6472; --line: rgba(27,42,74,0.14); --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--sans); color: #1a1a1a; background: var(--paper); line-height:1.55; overflow-x: hidden; }
  
  header { position:sticky; top:0; z-index:1000; background:var(--paper); border-bottom:1px solid var(--line); height: 84px; display: flex; align-items: center; }
  .nav-row { display:flex; align-items:center; justify-content:space-between; width: 100%; max-width:1180px; margin:0 auto; padding:0 24px; }
  .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); }
  .brand-mark { width:55px; height:45px; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:800; font-size: 13px; }
  .brand-name { font-family:var(--serif); font-weight:700; font-size:17px; }

  nav ul { display:flex; gap:20px; list-style:none; align-items: center; }
  nav a { font-size:13px; font-weight:600; color:var(--ink); text-decoration:none; }
  
  /* BOUTON ADMIN JAUNE - RÉSERVÉ ADMIN */
  .admin-item { display: none; }
  .admin-btn { background: var(--brass); color: #fff !important; padding: 8px 15px; border-radius: 4px; font-weight: 700; }
  
  /* PROFIL UTILISATEUR */
  #user-profile { display: none; font-weight: 700; color: var(--brass); font-size: 14px; }
  .nav-cta { background: var(--ink-deep); color:#fff !important; padding:10px 18px; font-size:12px; font-weight:600; border-radius:4px; text-decoration:none; }
  .menu-toggle { display: none; font-size: 30px; cursor: pointer; }

  @media (max-width: 1024px) {
    .menu-toggle { display: block; }
    nav ul { display: none; flex-direction: column; position: absolute; top: 84px; left: 0; width: 100%; background: #fff; padding: 20px; border-bottom: 2px solid var(--line); gap: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    nav ul.show { display: flex; }
  }

  .page-hero { background: var(--ink-deep); color:#EFE9DC; padding: 60px 0; text-align: center; }
  .search-container { max-width: 600px; margin: -30px auto 40px; padding: 0 20px; }
  #search-bar { width: 100%; padding: 18px 25px; border-radius: 100px; border: 1px solid var(--line); box-shadow: 0 10px 25px rgba(0,0,0,0.1); outline: none; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 20px; }
  .cycle-title { border-left: 5px solid var(--brass); padding-left: 15px; margin: 40px 0 20px; font-family: var(--serif); color: var(--ink); }

  details.level { background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  details.level > summary { cursor: pointer; padding: 20px; font-weight: 700; font-size: 18px; display: flex; justify-content: space-between; list-style: none; }
  .level-content { padding: 0 15px 20px; background: #fafafa; border-top: 1px solid #eee; }

  details.subject { background: #fff; border: 1px solid var(--line); margin-top: 8px; border-radius: 6px; }
  details.subject > summary { cursor: pointer; padding: 12px; font-weight: 600; display: flex; justify-content: space-between; font-size: 14px; list-style: none; }
  
  .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
  @media (max-width: 768px) { .subject-grid { grid-template-columns: 1fr; } }

  .doc-col h5 { font-size: 11px; text-transform: uppercase; color: var(--brass); margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 5px; }

  .devoirs-section { padding: 15px; border-top: 1px solid #eee; }
  .devoirs-section h5 { font-size: 11px; text-transform: uppercase; color: var(--brass); margin-bottom: 10px; }
  .devoir-item { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .devoir-item h6 { font-size: 14px; margin-bottom: 4px; color: var(--ink); }
  .devoir-meta { font-size: 11px; color: var(--slate); margin-bottom: 8px; }
  .rendu-status { font-size: 12px; color: #2e7d32; font-weight: 700; }
  .rendu-item { font-size: 12px; padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
  .devoir-btn { font-size: 11px; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; margin-right: 6px; margin-top: 4px; }
  .btn-voir-rendus { background: #3498db; color: #fff; }
  .btn-suppr-devoir { background: #eee; color: #333; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(16,25,46,0.6); z-index:2000; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
  .modal-overlay.show { display:flex; }
  .modal-box { background:#fff; border-radius:10px; padding:22px; width:100%; max-width:480px; margin-top:20px; }
  .modal-box h3 { font-family:var(--serif); margin-bottom:15px; color:var(--ink); }
  .modal-box .field { margin-bottom:12px; }
  .modal-box label { display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:var(--slate); }
  .modal-box input, .modal-box select, .modal-box textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:14px; }
  .qcm-question-block { border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:10px; position:relative; }
  .qcm-question-block input[type=text] { margin-bottom:6px; }
  .qcm-option-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .qcm-remove-q { position:absolute; top:8px; right:8px; background:none; border:none; color:#d9534f; cursor:pointer; font-weight:bold; font-size:16px; }
  .doc-col h5 { font-size: 11px; text-transform: uppercase; color: var(--brass); margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
  .doc-list { list-style: none; font-size: 13px; }
  .doc-list li { background: #fdfdfd; padding: 8px; border-radius: 4px; margin-bottom: 5px; display: flex; justify-content: space-between; border: 1px solid #eee; }
  
  .add-btn { display: none; margin-top: 8px; font-size: 11px; font-weight: 700; color: var(--ink); border: 1px dashed var(--brass); padding: 6px; border-radius: 4px; cursor: pointer; width: 100%; background: none; }
  .delete-btn { color: red; font-weight: bold; cursor: pointer; border: none; background: none; }

  footer { background: var(--ink-deep); color: #B7BCC9; padding: 40px; text-align: center; font-size: 13px; margin-top: 50px; }
</style>
</head>
<body>

<header>
  <div class="wrap nav-row">
    <a href="index.html" class="brand">
      <div class="brand-mark">LFAKM</div>
      <div style="margin-left:10px">Lycée Franco Arabe de Keur Madiabel</div>
    </a>
    <div class="menu-toggle" id="burger-btn">☰</div>
    <nav>
      <ul id="menu">
        <li><a href="index.html">Accueil</a></li>
        <li class="admin-item"><a href="admin-ine.html" class="admin-btn">⚙️ Import INE</a></li>
        <li class="admin-item"><a href="admin-gestion.html" class="admin-btn">⚙️ Gestion</a></li>
        <li id="user-profile"></li>
        <li><a href="identification.html" class="nav-cta" id="auth-link">Se connecter</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="modal-overlay" id="devoir-modal">
  <div class="modal-box">
    <h3>Proposer un devoir</h3>
    <div class="field">
      <label>Type de devoir</label>
      <select id="dv-type">
        <option value="fichier">Fichier à rendre</option>
        <option value="qcm">QCM en ligne</option>
      </select>
    </div>
    <div class="field">
      <label>Titre</label>
      <input type="text" id="dv-titre" placeholder="Ex : Contrôle chapitre 3">
    </div>
    <div class="field">
      <label>Consignes</label>
      <textarea id="dv-consignes" rows="3" placeholder="Facultatif"></textarea>
    </div>
    <div class="field">
      <label>Date limite</label>
      <input type="date" id="dv-date">
    </div>
    <div class="field">
      <label>Lien Google Doc (facultatif)</label>
      <input type="url" id="dv-gdoc" placeholder="https://docs.google.com/...">
    </div>
    <div class="field">
      <label>Fichier joint au devoir (facultatif)</label>
      <input type="file" id="dv-fichier">
    </div>
    <div id="qcm-builder" style="display:none;">
      <label>Questions du QCM</label>
      <div id="qcm-questions"></div>
      <button type="button" class="add-btn" id="qcm-add-question" style="display:block;">+ Ajouter une question</button>
    </div>
    <button class="add-btn" id="dv-submit" style="display:block; margin-top:15px;">Publier le devoir</button>
    <button class="add-btn" id="dv-cancel" style="display:block; border-color:#ccc; color:#999;">Annuler</button>
  </div>
</div>

<section class="page-hero">
  <div class="wrap">
    <h1>Espace Pédagogique</h1>
    <p id="welcome-msg">Supports de cours et travaux dirigés par classe.</p>
  </div>
</section>

<div class="search-container">
  <input type="text" id="search-bar" placeholder="Rechercher une matière (ex: Maths)...">
</div>

<main class="wrap" id="content-area"></main>

<footer>© 2026 Lycée Franco Arabe de Keur Madiabel</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, addDoc, onSnapshot, serverTimestamp, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
    authDomain: "lfakm-87dec.firebaseapp.com",
    projectId: "lfakm-87dec",
    storageBucket: "lfakm-87dec.firebasestorage.app",
    messagingSenderId: "739517262614",
    appId: "1:739517262614:web:14abd3538427960c527e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const MATS_COL = ["Mathématiques", "Français", "Anglais", "Arabe", "SVT", "Physique-Chimie", "Histoire-Géo", "EPS", "Éducation Religieuse"];
  const structure = [
    { area: "college-area", id: "6e", name: "Sixième", mats: MATS_COL.filter(m => m !== "Physique-Chimie") },
    { area: "college-area", id: "5e", name: "Cinquième", mats: MATS_COL.filter(m => m !== "Physique-Chimie") },
    { area: "college-area", id: "4e", name: "Quatrième", mats: MATS_COL },
    { area: "college-area", id: "3e", name: "Troisième", mats: MATS_COL },
    { area: "lycee-area", id: "2s2a", name: "Seconde S2A", mats: ["Mathématiques", "Physique-Chimie", "SVT", "Français", "Arabe", "Anglais", "Histoire-Géo", "EPS"] },
    { area: "lycee-area", id: "1s2a", name: "Première S2A", mats: ["Mathématiques", "Physique-Chimie", "SVT", "Français", "Arabe", "Anglais", "Histoire-Géo", "EPS"] },
    { area: "lycee-area", id: "ts2a", name: "Terminale S2A", mats: ["Mathématiques", "Physique-Chimie", "SVT", "Philosophie", "Français", "Arabe", "Anglais", "Histoire-Géo", "EPS"] },
    { area: "lycee-area", id: "2la", name: "Seconde LA", mats: ["Mathématiques", "Français", "Arabe", "Anglais", "Histoire-Géo", "EPS"] },
    { area: "lycee-area", id: "1la", name: "Première LA", mats: ["Mathématiques", "Français", "Arabe", "Anglais", "Histoire-Géo", "EPS"] },
    { area: "lycee-area", id: "tla", name: "Terminale LA", mats: ["Mathématiques", "Philosophie", "Français", "Arabe", "Anglais", "Histoire-Géo", "EPS"] }
  ];

  function buildUI() {
    let html = '';
    structure.forEach(c => {
        html += `<h2 class="cycle-title" data-level="${c.id}">${c.area === 'college-area' ? 'Collège' : 'Lycée'}</h2>`;
        const l = c;
        html += `<details class="level" data-level="${l.id}"><summary>${l.name} <span>+</span></summary><div class="level-content">`;
        l.mats.forEach(m => {
          const slugMat = m.toLowerCase().replace(/[^a-z0-9]/g, '');
          html += `<details class="subject" data-mat="${m}"><summary>${m} <span>▼</span></summary><div class="subject-grid"><div class="doc-col"><h5>Cours</h5><ul class="doc-list" id="cours-${l.id}-${slugMat}"></ul><button class="add-btn" onclick="window.up('cours-${l.id}-${slugMat}')">+ Ajouter</button></div><div class="doc-col"><h5>TD</h5><ul class="doc-list" id="td-${l.id}-${slugMat}"></ul><button class="add-btn" onclick="window.up('td-${l.id}-${slugMat}')">+ Ajouter</button></div></div><div class="devoirs-section"><h5>Devoirs</h5><div class="devoirs-list" id="devoirs-${l.id}-${slugMat}"></div><button class="add-btn" id="devoiradd-${l.id}-${slugMat}" onclick="window.newDevoir('${l.id}-${slugMat}')">+ Proposer un devoir</button></div></details>`;
        });
        html += `</div></details>`;
    });
    document.getElementById('content-area').innerHTML = html;
  }
  buildUI();

  let profile = null;
  function isAdmin(role) { return role === 'admin' || role === 'proviseur' || role === 'censeur'; }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, 'utilisateurs', user.uid));
      profile = snap.data();

      if ((profile.role === 'professeur' || profile.role === 'intendant') && profile.statut === 'en_attente') {
        document.getElementById('content-area').innerHTML =
          `<p style="text-align:center; padding:60px 20px; color:var(--slate);">
            ⏳ Votre compte est en attente de validation par le Proviseur ou le Censeur.
          </p>`;
        document.getElementById('user-profile').style.display = "block";
        document.getElementById('user-profile').textContent = `👤 ${profile.prenom} ${profile.nom}`;
        document.getElementById('auth-link').textContent = "Déconnexion";
        document.getElementById('auth-link').onclick = () => signOut(auth).then(() => window.location.reload());
        return;
      }

      document.getElementById('user-profile').style.display = "block";
      document.getElementById('user-profile').textContent = `👤 ${profile.prenom} ${profile.nom}`;
      if (isAdmin(profile.role)) document.querySelectorAll('.admin-item').forEach(el => el.style.display = "block");
      document.getElementById('auth-link').textContent = "Déconnexion";
      document.getElementById('auth-link').onclick = () => signOut(auth).then(() => window.location.reload());
    }
    applyLevelVisibility();
    syncDocs();
    syncDevoirs();
  });

  function applyLevelVisibility() {
    const role = profile?.role;
    const profMats = profile?.disciplines || [];

    document.querySelectorAll('details.level').forEach(levelEl => {
      const lvlId = levelEl.dataset.level;
      let visible = true; // admin/proviseur/censeur et visiteurs non connectés voient tout
      if (role === 'professeur') {
        visible = (profile.assignedClasses || []).includes(lvlId);
      } else if (role === 'eleve') {
        visible = profile.niveau === lvlId;
      }
      levelEl.style.display = visible ? '' : 'none';

      // Masque le titre "Collège"/"Lycée" correspondant si ce niveau est caché
      const header = document.querySelector(`.cycle-title[data-level="${lvlId}"]`);
      if (header) header.style.display = visible ? '' : 'none';

      // Filtre les matières : un prof ne voit que ses propres disciplines
      if (visible) {
        levelEl.querySelectorAll('details.subject').forEach(subjectEl => {
          let matVisible = true;
          if (role === 'professeur') {
            matVisible = profMats.includes(subjectEl.dataset.mat);
          }
          subjectEl.style.display = matVisible ? '' : 'none';
        });
      }
    });
  }

  function syncDocs() {
    const role = profile?.role;
    const profMats = profile?.disciplines || [];
    document.querySelectorAll('.doc-list').forEach(ul => {
      const slug = ul.id.replace(/^cours-|^td-/, '');
      const type = ul.id.startsWith('cours-') ? 'cours' : 'td';
      const btn = ul.nextElementSibling;
      const matName = ul.closest('.subject').querySelector('summary').textContent.toLowerCase();

      if (role === 'professeur' && profMats.some(d => matName.includes(d.toLowerCase()))) btn.style.display = "block";
      if (isAdmin(role)) btn.style.display = "block";

      onSnapshot(query(collection(db, 'ressources', slug, type), orderBy('date', 'desc')), (snap) => {
        ul.innerHTML = snap.empty ? '<li style="color:gray;border:none;background:none;">Aucun fichier</li>' : '';
        snap.forEach(docSnap => {
          const d = docSnap.data();
          const li = document.createElement('li');
          li.innerHTML = `<a href="${d.url}" target="_blank">📄 ${d.titre}</a>`;
          if (role === 'professeur' || isAdmin(role)) {
            const del = document.createElement('button');
            del.innerHTML = '✕'; del.className = 'delete-btn';
            del.onclick = () => confirm('Supprimer?') && deleteDoc(doc(db, 'ressources', slug, type, docSnap.id));
            li.appendChild(del);
          }
          ul.appendChild(li);
        });
      });
    });
  }

  function syncDevoirs() {
    const role = profile?.role;
    const profMats = profile?.disciplines || [];

    document.querySelectorAll('.devoirs-list').forEach(container => {
      const slug = container.id.replace(/^devoirs-/, '');
      const subjectEl = container.closest('.subject');
      const matName = subjectEl.dataset.mat;
      const addBtn = document.getElementById(`devoiradd-${slug}`);

      if ((role === 'professeur' && profMats.includes(matName)) || isAdmin(role)) {
        addBtn.style.display = "block";
      }

      onSnapshot(query(collection(db, 'ressources', slug, 'devoirs'), orderBy('date', 'desc')), (snap) => {
        container.innerHTML = snap.empty ? '<p style="color:gray;font-size:12px;">Aucun devoir pour le moment</p>' : '';
        snap.forEach(devDoc => {
          const dv = devDoc.data();
          const dvType = dv.type === 'qcm' ? 'qcm' : 'fichier';
          const item = document.createElement('div');
          item.className = 'devoir-item';
          item.innerHTML = `<h6>📌 ${dv.titre}${dvType === 'qcm' ? ' <span style="font-size:10px; color:var(--brass); font-weight:700;">QCM</span>' : ''}</h6>
            <div class="devoir-meta">📅 À rendre pour le ${dv.dateLimite || 'non précisé'} — proposé par ${dv.profNom || 'le professeur'}</div>
            ${dv.consignes ? `<p style="font-size:13px; margin-bottom:8px;">${dv.consignes}</p>` : ''}
            ${dv.googleDocUrl ? `<p style="margin-bottom:8px;"><a href="${dv.googleDocUrl}" target="_blank">📄 Ouvrir le document Google Doc</a></p>` : ''}
            ${dv.fichierUrl ? `<p style="margin-bottom:8px;"><a href="${dv.fichierUrl}" target="_blank">📎 ${dv.fichierNom || 'Fichier joint'}</a></p>` : ''}`;

          if (role === 'eleve') {
            const responseArea = document.createElement('div');
            item.appendChild(responseArea);
            if (dvType === 'qcm') {
              renderQcmForStudent(slug, devDoc.id, dv, responseArea);
            } else {
              checkRendu(slug, devDoc.id, responseArea);
            }
          } else if (role === 'professeur' || isAdmin(role)) {
            const rendusBox = document.createElement('div');
            rendusBox.style.display = 'none';
            rendusBox.style.marginTop = '8px';

            const voirBtn = document.createElement('button');
            voirBtn.className = 'devoir-btn btn-voir-rendus';
            voirBtn.textContent = 'Voir les rendus';
            voirBtn.onclick = () => {
              const showing = rendusBox.style.display === 'block';
              rendusBox.style.display = showing ? 'none' : 'block';
              if (!showing) loadRendus(slug, devDoc.id, rendusBox, dvType);
            };
            item.appendChild(voirBtn);

            const delBtn = document.createElement('button');
            delBtn.className = 'devoir-btn btn-suppr-devoir';
            delBtn.textContent = '✕ Supprimer';
            delBtn.onclick = () => confirm('Supprimer ce devoir ?') && deleteDoc(doc(db, 'ressources', slug, 'devoirs', devDoc.id));
            item.appendChild(delBtn);

            item.appendChild(rendusBox);
          }
          container.appendChild(item);
        });
      });
    });
  }

  function checkRendu(slug, devoirId, statusDiv) {
    const uid = auth.currentUser?.uid;
    if (!uid) return;
    onSnapshot(doc(db, 'ressources', slug, 'devoirs', devoirId, 'rendus', uid), (snap) => {
      if (snap.exists()) {
        const d = snap.data();
        statusDiv.innerHTML = `<span class="rendu-status">✅ Devoir rendu</span> — <a href="${d.url}" target="_blank">voir mon fichier</a><br><button class="add-btn" style="display:block;margin-top:6px;" onclick="window.rendreDevoir('${slug}','${devoirId}')">Renvoyer un autre fichier</button>`;
      } else {
        statusDiv.innerHTML = `<button class="add-btn" style="display:block;" onclick="window.rendreDevoir('${slug}','${devoirId}')">📤 Rendre le devoir (fichier ou capture d'écran)</button>`;
      }
    });
  }

  function renderQcmForStudent(slug, devoirId, dv, container) {
    const uid = auth.currentUser?.uid;
    if (!uid) return;
    onSnapshot(doc(db, 'ressources', slug, 'devoirs', devoirId, 'rendus', uid), (snap) => {
      if (snap.exists()) {
        const d = snap.data();
        container.innerHTML = `<span class="rendu-status">✅ QCM rendu — Score : ${d.score}/${dv.questions.length}</span><br><button class="add-btn" style="display:block;margin-top:6px;" id="retry-${devoirId}">Repasser le QCM</button>`;
        document.getElementById(`retry-${devoirId}`).onclick = () => buildQcmForm(slug, devoirId, dv, container);
      } else {
        buildQcmForm(slug, devoirId, dv, container);
      }
    });
  }

  function buildQcmForm(slug, devoirId, dv, container) {
    let html = '';
    dv.questions.forEach((q, qi) => {
      html += `<div style="margin-bottom:10px;"><p style="font-size:13px;font-weight:700;margin-bottom:6px;">${qi + 1}. ${q.texte}</p>`;
      q.options.forEach((opt, oi) => {
        html += `<label style="display:block;font-size:13px;margin-bottom:4px;"><input type="radio" name="qcmrep-${devoirId}-${qi}" value="${oi}"> ${opt}</label>`;
      });
      html += `</div>`;
    });
    html += `<button class="add-btn" style="display:block;" id="submit-qcm-${devoirId}">Envoyer mes réponses</button>`;
    container.innerHTML = html;
    document.getElementById(`submit-qcm-${devoirId}`).onclick = async () => {
      const reponses = [];
      let complete = true;
      dv.questions.forEach((q, qi) => {
        const checked = container.querySelector(`input[name="qcmrep-${devoirId}-${qi}"]:checked`);
        if (!checked) complete = false;
        reponses.push(checked ? parseInt(checked.value, 10) : -1);
      });
      if (!complete) { alert("Répondez à toutes les questions avant d'envoyer."); return; }
      const score = reponses.filter((r, i) => r === dv.questions[i].correctIndex).length;
      const uid = auth.currentUser.uid;
      await setDoc(doc(db, 'ressources', slug, 'devoirs', devoirId, 'rendus', uid), {
        eleveNom: `${profile.prenom} ${profile.nom}`,
        reponses, score,
        date: serverTimestamp()
      });
    };
  }

  function loadRendus(slug, devoirId, container, dvType) {
    onSnapshot(collection(db, 'ressources', slug, 'devoirs', devoirId, 'rendus'), (snap) => {
      container.innerHTML = snap.empty ? '<p style="font-size:12px;color:gray;">Aucun rendu pour le moment</p>' : '';
      snap.forEach(rd => {
        const d = rd.data();
        const p = document.createElement('div');
        p.className = 'rendu-item';
        if (dvType === 'qcm') {
          p.innerHTML = `${d.eleveNom} — Score : <b>${d.score}</b>`;
        } else {
          p.innerHTML = `<a href="${d.url}" target="_blank">📄 ${d.eleveNom}</a>`;
        }
        container.appendChild(p);
      });
    });
  }

  let currentDevoirSlug = null;
  let qcmQuestionCount = 0;

  function addQcmQuestion() {
    const idx = qcmQuestionCount++;
    const block = document.createElement('div');
    block.className = 'qcm-question-block';
    block.innerHTML = `<button type="button" class="qcm-remove-q" onclick="this.parentElement.remove()">✕</button>
      <input type="text" class="qcm-q-text" placeholder="Question ${idx + 1}">
      ${[0, 1, 2, 3].map(i => `<div class="qcm-option-row"><input type="radio" name="qcm-correct-${idx}" value="${i}" ${i === 0 ? 'checked' : ''}><input type="text" class="qcm-option" placeholder="Option ${i + 1} (cocher si c'est la bonne réponse)"></div>`).join('')}`;
    document.getElementById('qcm-questions').appendChild(block);
  }

  window.newDevoir = (slug) => {
    currentDevoirSlug = slug;
    document.getElementById('dv-titre').value = '';
    document.getElementById('dv-consignes').value = '';
    document.getElementById('dv-date').value = '';
    document.getElementById('dv-gdoc').value = '';
    document.getElementById('dv-fichier').value = '';
    document.getElementById('dv-type').value = 'fichier';
    document.getElementById('qcm-builder').style.display = 'none';
    document.getElementById('qcm-questions').innerHTML = '';
    qcmQuestionCount = 0;
    addQcmQuestion();
    document.getElementById('devoir-modal').classList.add('show');
  };

  document.getElementById('dv-type').addEventListener('change', (e) => {
    document.getElementById('qcm-builder').style.display = e.target.value === 'qcm' ? 'block' : 'none';
  });
  document.getElementById('qcm-add-question').onclick = addQcmQuestion;
  document.getElementById('dv-cancel').onclick = () => document.getElementById('devoir-modal').classList.remove('show');

  document.getElementById('dv-submit').onclick = async () => {
    const type = document.getElementById('dv-type').value;
    const titre = document.getElementById('dv-titre').value.trim();
    if (!titre) { alert('Le titre est obligatoire.'); return; }
    const consignes = document.getElementById('dv-consignes').value.trim();
    const dateLimite = document.getElementById('dv-date').value;
    const googleDocUrl = document.getElementById('dv-gdoc').value.trim();
    const fichierInput = document.getElementById('dv-fichier');

    const devoirData = {
      type, titre, consignes, dateLimite,
      googleDocUrl: googleDocUrl || null,
      profNom: `${profile.prenom} ${profile.nom}`,
      date: serverTimestamp()
    };

    if (type === 'qcm') {
      const questions = [];
      document.querySelectorAll('#qcm-questions .qcm-question-block').forEach(block => {
        const texte = block.querySelector('.qcm-q-text').value.trim();
        const options = Array.from(block.querySelectorAll('.qcm-option')).map(o => o.value.trim());
        const correctIndex = parseInt(block.querySelector('input[type=radio]:checked').value, 10);
        if (texte && options.every(o => o)) questions.push({ texte, options, correctIndex });
      });
      if (questions.length === 0) { alert('Ajoutez au moins une question complète (texte + 4 options).'); return; }
      devoirData.questions = questions;
    }

    const submitBtn = document.getElementById('dv-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = "Publication...";

    if (fichierInput.files[0]) {
      const fd = new FormData();
      fd.append('file', fichierInput.files[0]);
      fd.append('upload_preset', "lfakm_ressources");
      const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', { method: 'POST', body: fd });
      const data = await res.json();
      devoirData.fichierUrl = data.secure_url;
      devoirData.fichierNom = fichierInput.files[0].name;
    }

    await addDoc(collection(db, 'ressources', currentDevoirSlug, 'devoirs'), devoirData);
    submitBtn.disabled = false;
    submitBtn.textContent = "Publier le devoir";
    document.getElementById('devoir-modal').classList.remove('show');
  };

  window.rendreDevoir = async (slug, devoirId) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,.pdf,.doc,.docx';
    input.onchange = async () => {
      const fd = new FormData();
      fd.append('file', input.files[0]);
      fd.append('upload_preset', "lfakm_ressources");
      const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', { method: 'POST', body: fd });
      const data = await res.json();
      const uid = auth.currentUser.uid;
      await setDoc(doc(db, 'ressources', slug, 'devoirs', devoirId, 'rendus', uid), {
        eleveNom: `${profile.prenom} ${profile.nom}`,
        url: data.secure_url,
        date: serverTimestamp()
      });
      alert('Devoir envoyé !');
    };
    input.click();
  };

  window.up = async (id) => {
    const titre = prompt('Nom du document :');
    if (!titre) return;
    const input = document.createElement('input');
    input.type = 'file';
    input.onchange = async () => {
      const fd = new FormData();
      fd.append('file', input.files[0]);
      fd.append('upload_preset', "lfakm_ressources");
      const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', { method: 'POST', body: fd });
      const data = await res.json();
      const type = id.startsWith('cours-') ? 'cours' : 'td';
      await addDoc(collection(db, 'ressources', id.replace(/^cours-|^td-/, ''), type), { titre, url: data.secure_url, date: serverTimestamp() });
    };
    input.click();
  };

  document.getElementById('burger-btn').onclick = () => document.getElementById('menu').classList.toggle('show');
  document.getElementById('search-bar').oninput = (e) => {
    const t = e.target.value.toLowerCase();
    document.querySelectorAll('.subject').forEach(s => s.style.display = s.innerText.toLowerCase().includes(t) ? 'block' : 'none');
  };
</script>
</body>
</html>
