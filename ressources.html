<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressources pédagogiques — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A; --ink-deep: #10192E; --paper: #F7F5F0;
    --brass: #A8853F; --slate: #5B6472; --text: #1A1A1A;
    --line: rgba(27,42,74,0.14); --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--sans); color: var(--text); background: var(--paper); line-height:1.5; }
  
  header { position:sticky; top:0; z-index:1000; background:var(--paper); border-bottom:1px solid var(--line); height: 84px; display: flex; align-items: center; }
  .nav-row { display:flex; align-items:center; justify-content:space-between; width: 100%; max-width:1180px; margin:0 auto; padding:0 24px; }
  .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); }
  .brand-mark { width:55px; height:45px; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:800; font-size: 13px; }
  .brand-name { font-family:var(--serif); font-weight:700; font-size:16px; }

  nav ul { display:flex; gap:20px; list-style:none; align-items: center; }
  nav a { font-size:13px; font-weight:600; color:var(--ink); text-decoration:none; }
  #admin-link { color: #fff; background: var(--brass); padding: 8px 12px; border-radius: 4px; display: none; font-weight: 800; }
  #user-name { color: var(--brass); font-weight: 700; display: none; font-size: 14px; }
  .nav-cta { background: var(--ink-deep); color:#fff !important; padding:10px 18px; font-size:12px; font-weight:600; border-radius:4px; text-decoration:none; }
  .menu-toggle { display: none; font-size: 30px; cursor: pointer; }

  @media (max-width: 1024px) {
    .menu-toggle { display: block; }
    nav ul { display: none; flex-direction: column; position: absolute; top: 84px; left: 0; width: 100%; background: var(--paper); padding: 20px; border-bottom: 2px solid var(--line); gap: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    nav ul.show { display: flex; }
  }

  .page-hero { background: var(--ink-deep); color:#EFE9DC; padding: 50px 0; text-align: center; }
  .search-container { max-width: 600px; margin: -25px auto 30px; padding: 0 20px; }
  #search-bar { width: 100%; padding: 15px 25px; border-radius: 50px; border: 1px solid var(--line); box-shadow: 0 10px 25px rgba(0,0,0,0.1); outline: none; }

  .wrap { max-width:1100px; margin:0 auto; padding:0 20px; }
  .cycle-title { border-left: 5px solid var(--brass); padding-left: 15px; margin: 40px 0 20px; font-family: var(--serif); color: var(--ink); }
  details.level { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; display: block; } /* Visible par défaut */
  details.level > summary { cursor: pointer; padding: 20px; font-weight: 700; font-size: 18px; display: flex; justify-content: space-between; list-style: none; }
  .level-content { padding: 10px 20px 20px; background: #fafafa; border-top: 1px solid #eee; }
  details.subject { background: #fff; border: 1px solid var(--line); margin-top: 8px; border-radius: 6px; }
  details.subject > summary { cursor: pointer; padding: 12px; font-weight: 600; display: flex; justify-content: space-between; font-size: 14px; list-style: none; }
  .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
  @media (max-width: 768px) { .subject-grid { grid-template-columns: 1fr; } }
  .doc-col h5 { font-size: 11px; text-transform: uppercase; color: var(--brass); margin-bottom: 8px; border-bottom: 1px solid #eee; }
  .doc-list { list-style: none; font-size: 13px; }
  .doc-list li { background: #fdfdfd; padding: 8px; border-radius: 4px; margin-bottom: 5px; display: flex; justify-content: space-between; border: 1px solid #eee; }
  .add-btn { display: none; margin-top: 8px; font-size: 11px; font-weight: 700; color: var(--ink); border: 1px dashed var(--brass); padding: 6px; border-radius: 4px; cursor: pointer; width: 100%; background: none; }
  .delete-btn { color: red; font-weight: bold; cursor: pointer; border: none; background: none; }
  footer { background: var(--ink-deep); color: #B7BCC9; padding: 40px; text-align: center; font-size: 13px; margin-top: 50px; }
</style>
</head>
<body>

<header>
  <div class="nav-row">
    <a href="index.html" class="brand">
      <div class="brand-mark">LFAKM</div>
      <div class="brand-name">Lycée Franco Arabe de Keur Madiabel</div>
    </a>
    <div class="menu-toggle" id="burger">☰</div>
    <nav>
      <ul id="menu">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="ressources.html" style="color:var(--brass)">Ressources</a></li>
        <li><a href="admin-ine.html" id="admin-link">⚙️ Administration</a></li>
        <li id="user-name"></li>
        <li><a href="identification.html" class="nav-cta" id="btn-auth">Se connecter</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <h1>Espace Pédagogique Numérique</h1>
    <p id="welcome-msg">Veuillez vous connecter pour accéder à vos classes assignées.</p>
  </div>
</section>

<div class="search-container">
  <input type="text" id="search-bar" placeholder="Rechercher une matière...">
</div>

<main class="wrap" id="main-container">
  <div id="college-section">
      <h2 class="cycle-title">Cycle Moyen (Collège)</h2>
      <div id="college-area"></div>
  </div>

  <div id="lycee-section">
      <h2 class="cycle-title">Cycle Secondaire (Lycée)</h2>
      <div id="lycee-area"></div>
  </div>
</main>

<footer>© 2026 Lycée Franco Arabe de Keur Madiabel</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, deleteDoc, collection, addDoc, onSnapshot, serverTimestamp, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
    authDomain: "lfakm-87dec.firebaseapp.com",
    projectId: "lfakm-87dec",
    storageBucket: "lfakm-87dec.firebasestorage.app",
    messagingSenderId: "739517262614",
    appId: "1:739517262614:web:14abd3538427960c527e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const structure = [
    { area: "college-area", id: "6e", name: "Classe de Sixième", mats: ["Mathématiques", "Français", "Anglais", "Arabe", "SVT", "Histoire-Géo", "EPS", "Éducation Religieuse"] },
    { area: "college-area", id: "5e", name: "Classe de Cinquième", mats: ["Mathématiques", "Français", "Anglais", "Arabe", "SVT", "Histoire-Géo", "EPS", "Éducation Religieuse"] },
    { area: "college-area", id: "4e", name: "Classe de Quatrième", mats: ["Mathématiques", "Français", "Anglais", "Arabe", "SVT", "Physique-Chimie", "Histoire-Géo", "EPS", "Éducation Religieuse"] },
    { area: "college-area", id: "3e", name: "Classe de Troisième", mats: ["Mathématiques", "Français", "Anglais", "Arabe", "SVT", "Physique-Chimie", "Histoire-Géo", "EPS", "Éducation Religieuse"] },
    { area: "lycee-area", id: "2s2a", name: "Seconde S2A", mats: ["Mathématiques", "PC", "SVT", "Français", "Arabe", "Anglais", "Histoire-Géo", "EPS", "Civilisation"] },
    { area: "lycee-area", id: "2la", name: "Seconde LA", mats: ["Mathématiques", "Français", "Anglais", "Arabe", "HG", "EPS", "Civilisation"] },
    { area: "lycee-area", id: "1s2a", name: "Première S2A", mats: ["Mathématiques", "PC", "SVT", "Français", "Anglais", "Arabe", "HG", "EPS", "Civilisation"] },
    { area: "lycee-area", id: "1la", name: "Première LA", mats: ["Français", "Anglais", "Arabe", "HG", "Philosophie", "Civilisation", "Mathématiques"] },
    { area: "lycee-area", id: "ts2a", name: "Terminale S2A", mats: ["Mathématiques", "PC", "SVT", "Philosophie", "Français", "Anglais", "Arabe", "HG"] },
    { area: "lycee-area", id: "tla", name: "Terminale LA", mats: ["Philosophie", "Français", "Anglais", "Arabe", "HG", "Civilisation", "Mathématiques"] }
  ];

  function draw() {
    levels.forEach(l => {
      let h = `<details class="level" id="lvl-${l.id}"><summary>${l.name} <span>+</span></summary><div class="level-content">`;
      l.mats.forEach(m => {
        const id = m.toLowerCase().replace(/[^a-z]/g, '');
        h += `<details class="subject"><summary>${m} <span>▼</span></summary><div class="subject-grid">
          <div class="doc-col"><h5>Cours</h5><ul class="doc-list" id="c-${l.id}-${id}"></ul><button class="add-btn" onclick="window.up('c-${l.id}-${id}')">+ Ajouter</button></div>
          <div class="doc-col"><h5>TD</h5><ul class="doc-list" id="t-${l.id}-${id}"></ul><button class="add-btn" onclick="window.up('t-${l.id}-${id}')">+ Ajouter</button></div>
        </div></details>`;
      });
      h += `</div></details>`;
      document.getElementById(l.area).innerHTML += h;
    });
  }

  let profile = null;
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, 'utilisateurs', user.uid));
      profile = snap.data();
      document.getElementById('user-name').style.display = "block";
      document.getElementById('user-name').textContent = "👤 " + profile.prenom + " " + profile.nom;
      document.getElementById('welcome-msg').textContent = "Heureux de vous revoir, " + profile.prenom + ". Voici vos classes assignées.";
      
      if (profile.role === 'professeur') document.getElementById('admin-link').style.display = "block";
      document.getElementById('btn-auth').textContent = "Déconnexion";
      document.getElementById('btn-auth').onclick = () => signOut(auth).then(() => window.location.reload());

      filterClasses(profile);
    } else {
        // Si non connecté, on montre tout ou rien selon votre choix. Ici on montre tout.
        filterClasses(null);
    }
  });

  function filterClasses(userData) {
      const collegeArea = document.getElementById('college-area');
      const lyceeArea = document.getElementById('lycee-area');
      collegeArea.innerHTML = "";
      lyceeArea.innerHTML = "";

      structure.forEach(l => {
          // LOGIQUE : Si professeur, on vérifie s'il a accès à cette classe
          // userData.classes doit contenir les IDs comme ["6e", "4e"]
          let hasAccess = false;
          if (!userData) hasAccess = true; // Visiteur voit tout
          else if (userData.role === 'admin') hasAccess = true; // Admin voit tout
          else if (userData.classes && userData.classes.includes(l.id)) hasAccess = true; // Prof assigné
          else if (userData.role === 'eleve' && userData.niveau === l.id) hasAccess = true; // Elève voit sa classe

          if (hasAccess) {
            let h = `<details class="level" id="lvl-${l.id}"><summary>${l.name} <span>+</span></summary><div class="level-content">`;
            l.mats.forEach(m => {
                const matId = m.toLowerCase().replace(/[^a-z0-9]/g, '');
                h += `<details class="subject"><summary>${m} <span>▼</span></summary><div class="subject-grid">
                  <div class="doc-col"><h5>Cours</h5><ul class="doc-list" id="c-${l.id}-${matId}"></ul><button class="add-btn" onclick="window.up('c-${l.id}-${matId}')">+ Ajouter</button></div>
                  <div class="doc-col"><h5>TD</h5><ul class="doc-list" id="t-${l.id}-${matId}"></ul><button class="add-btn" onclick="window.up('t-${l.id}-${matId}')">+ Ajouter</button></div>
                </div></details>`;
            });
            h += `</div></details>`;
            document.getElementById(l.area).innerHTML += h;
          }
      });
      
      // Masquer les sections vides
      document.getElementById('college-section').style.display = collegeArea.innerHTML === "" ? "none" : "block";
      document.getElementById('lycee-section').style.display = lyceeArea.innerHTML === "" ? "none" : "block";

      syncDocs();
  }

  function syncDocs() {
    document.querySelectorAll('.doc-list').forEach(ul => {
      const path = ul.id;
      const type = path.startsWith('c-') ? 'cours' : 'td';
      const slug = path.replace(/^c-|^t-/, '');
      const btn = ul.nextElementSibling;
      const matName = ul.closest('.subject').querySelector('summary').textContent.toLowerCase();

      // Un prof ne peut uploader que dans SA matière
      if (profile?.role === 'professeur' && profile.disciplines.some(d => matName.includes(d.toLowerCase()))) {
          btn.style.display = "block";
      }

      onSnapshot(query(collection(db, 'ressources', slug, type), orderBy('date', 'desc')), (snap) => {
        ul.innerHTML = snap.empty ? '<li style="color:gray;border:none;background:none;">Aucun document</li>' : '';
        snap.forEach(dDoc => {
          const d = dDoc.data();
          const li = document.createElement('li');
          li.innerHTML = `<a href="${d.url}" target="_blank">📄 ${d.titre}</a>`;
          if (profile?.role === 'professeur' || profile?.role === 'admin') {
            const del = document.createElement('button');
            del.innerHTML = '✕'; del.className = 'delete-btn';
            del.onclick = () => confirm('Supprimer?') && deleteDoc(doc(db, 'ressources', slug, type, dDoc.id));
            li.appendChild(del);
          }
          ul.appendChild(li);
        });
      });
    });
  }

  window.up = async (id) => {
    const t = prompt('Titre du document :');
    if (!t) return;
    const i = document.createElement('input');
    i.type = 'file';
    i.onchange = async () => {
      const fd = new FormData();
      fd.append('file', i.files[0]);
      fd.append('upload_preset', "lfakm_ressources");
      const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', { method: 'POST', body: fd });
      const data = await res.json();
      await addDoc(collection(db, 'ressources', id.replace(/^c-|^t-/, ''), id.startsWith('c-') ? 'cours' : 'td'), {
        titre: t, url: data.secure_url, date: serverTimestamp()
      });
    };
    input.click();
  };

  document.getElementById('burger').onclick = () => document.getElementById('menu').classList.toggle('show');
  document.getElementById('search-bar').oninput = (e) => {
    const t = e.target.value.toLowerCase();
    document.querySelectorAll('.subject').forEach(s => s.style.display = s.innerText.toLowerCase().includes(t) ? 'block' : 'none');
  };
</script>
</body>
</html>
