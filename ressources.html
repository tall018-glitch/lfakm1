<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Pédagogique — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1B2A4A; --ink-deep: #10192E; --paper: #F7F5F0; --brass: #A8853F; --slate: #5B6472; --text: #1A1A1A; --line: rgba(27,42,74,0.14); --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter', sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--sans); color: var(--text); background: #f4f2ed; line-height:1.55; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 24px; }

  /* NAVIGATION */
  header { background: #fff; border-bottom: 1px solid var(--line); height: 75px; display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; }
  .nav-row { display:flex; align-items:center; justify-content:space-between; width: 100%; }
  .brand-name { font-family:var(--serif); font-weight:700; font-size:18px; color:var(--ink); text-decoration:none; }
  .nav-cta { background: var(--ink); color:#fff; padding:8px 15px; border-radius:5px; font-size:12px; border:none; cursor:pointer; text-decoration: none;}

  /* BARRES DE CONTRÔLE */
  .control-panel { background: var(--ink-deep); color: white; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .archive-bar { padding: 10px 0; text-align: center; font-size: 13px; }
  .archive-bar select { background: white; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 10px; }
  
  #admin-toolbar { background: var(--brass); color: white; padding: 12px 0; display: none; text-align: center; }
  .switch-btn { background: rgba(255,255,255,0.2); border: 1px solid #fff; color: white; padding: 6px 18px; margin: 0 5px; cursor: pointer; border-radius: 20px; font-size: 11px; font-weight: bold; text-decoration: none; display: inline-block;}
  .switch-btn.active { background: white !important; color: var(--brass) !important; }

  /* HERO */
  .page-hero { background: var(--ink-deep); color: #fff; padding: 40px 0; text-align: center; }
  .page-hero h1 { font-family: var(--serif); font-size: 30px; margin-bottom: 5px; }
  #welcome-msg { color: #C7CBD6; font-size: 15px; margin-top: 10px; }

  /* ACCORDÉONS */
  .cycle-title { font-family: var(--serif); color: var(--ink); margin: 30px 0 10px; border-bottom: 2px solid var(--brass); display: inline-block; padding-bottom: 5px; }
  details.level { background: #fff; border: 1px solid var(--line); margin-bottom: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
  details.level summary { padding: 18px 25px; cursor: pointer; font-family: var(--serif); font-size: 19px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  .level-content { padding: 5px 20px 25px; background: #fafafa; border-top: 1px solid var(--line); }

  details.subject { background: #fff; border: 1px solid var(--line); margin-top: 10px; border-radius: 6px; }
  details.subject summary { padding: 12px 15px; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; color: var(--ink); }

  /* GRILLE DOCUMENTS */
  .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; padding: 10px; }
  .doc-col { background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #eee; }
  .doc-col h5 { font-size: 11px; text-transform: uppercase; color: var(--brass); margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 4px; }
  .doc-list { list-style: none; }
  .doc-list li { background: #f1ece1; padding: 8px 12px; border-radius: 4px; margin-bottom: 6px; border: 1px solid #e0ddd5; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  
  .add-btn { margin-top: 8px; font-size: 10px; font-weight: 700; color: #fff; background: var(--ink); border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; }
  .delete-btn { color: #d9534f; cursor: pointer; border: none; background: none; font-weight: bold; font-size: 18px; }
  
  #loader-msg { color: #FFD700; font-weight: bold; display: none; text-align: center; padding: 10px; background: var(--ink-deep); }
  .alert-box { background: white; padding: 40px; border-radius: 10px; text-align: center; border: 1px solid var(--line); margin-top: 40px; }
</style>
</head>
<body>

<div class="control-panel">
    <div class="archive-bar">
        Année Scolaire : 
        <select id="year-selector">
            <option value="2025-2026">2025-2026</option>
        </select>
    </div>
    <div id="admin-toolbar">
        <span style="margin-right:10px; font-size:11px; font-weight: bold;">ADMIN :</span>
        <button class="switch-btn active" id="view-all">Vue Globale Lycée</button>
        <button class="switch-btn" id="view-teacher">Mes Classes & Edition</button>
        <a href="admin-gestion.html" class="switch-btn" style="background:rgba(0,0,0,0.3)">Gestion des Comptes</a>
    </div>
</div>

<header>
    <div class="wrap nav-row">
        <a href="index.html" class="brand-name">LFAKM - Ressources</a>
        <nav><a href="#" id="logout-btn" class="nav-cta">Déconnexion</a></nav>
    </div>
</header>

<div id="loader-msg">Publication en cours...</div>

<section class="page-hero">
    <div class="wrap">
        <h1 id="hero-title">Ressources Numériques</h1>
        <p id="welcome-msg">Chargement du profil...</p>
    </div>
</section>

<main class="wrap" id="main-content"></main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
    authDomain: "lfakm-87dec.firebaseapp.com",
    projectId: "lfakm-87dec",
    storageBucket: "lfakm-87dec.firebasestorage.app",
    messagingSenderId: "739517262614",
    appId: "1:739517262614:web:14abd3538427960c527e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const classesConfig = [
    { id: "sixieme", name: "6ème", mats: ["Français", "Mathématiques", "SVT", "Anglais"] },
    { id: "cinquieme", name: "5ème", mats: ["Français", "Mathématiques", "SVT", "Anglais"] },
    { id: "quatrieme", name: "4ème", mats: ["Mathématiques", "Sciences Physiques", "SVT"] },
    { id: "troisieme", name: "3ème", mats: ["Mathématiques", "Sciences Physiques", "SVT"] },
    { id: "seconde-serie-s2a", name: "Seconde S2A", mats: ["Mathématiques", "Sciences Physiques", "SVT"] },
    { id: "premiere-serie-s2a", name: "Première S2A", mats: ["Mathématiques", "Sciences Physiques", "SVT"] },
    { id: "terminale-serie-s2a", name: "Terminale S2A", mats: ["Mathématiques", "Sciences Physiques", "SVT", "Philosophie"] }
  ];

  let profil = null;
  let viewingYear = "2025-2026";
  let viewMode = 'all'; 

  function slug(t) { return t.toLowerCase().trim().replace(/ /g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      try {
        const snap = await getDoc(doc(db, 'utilisateurs', user.uid));
        profil = snap.data();

        // Récupération année config
        const configSnap = await getDoc(doc(db, "config", "schoolYear"));
        const currentSchoolYear = configSnap.exists() ? configSnap.data().year : "2025-2026";
        viewingYear = currentSchoolYear;

        // Mise à jour sélecteur
        const sel = document.getElementById('year-selector');
        sel.innerHTML = `<option value="${currentSchoolYear}">${currentSchoolYear} (Actuelle)</option><option value="2024-2025">2024-2025</option>`;
        sel.value = viewingYear;
        sel.onchange = (e) => { viewingYear = e.target.value; render(); };

        // Gestion Toolbar Admin
        if (profil.role === 'admin') {
            document.getElementById('admin-toolbar').style.display = 'block';
            setupAdminToggles();
        }

        render();
      } catch (err) {
        console.error(err);
        document.getElementById('welcome-msg').textContent = "Erreur de chargement des données.";
      }
    } else {
      window.location.href = "identification.html";
    }
  });

  function setupAdminToggles() {
    const bAll = document.getElementById('view-all');
    const bTeach = document.getElementById('view-teacher');
    bAll.onclick = () => { viewMode = 'all'; bAll.classList.add('active'); bTeach.classList.remove('active'); render(); };
    bTeach.onclick = () => { viewMode = 'teacher'; bTeach.classList.add('active'); bAll.classList.remove('active'); render(); };
  }

  function render() {
    const main = document.getElementById('main-content');
    const welcome = document.getElementById('welcome-msg');
    main.innerHTML = '';

    const role = profil.role;
    const myMats = profil.disciplines || [];
    const myClasses = profil.assignedClasses || [];
    const isCurrent = (viewingYear === document.getElementById('year-selector').options[0].value);

    welcome.textContent = `Connecté : ${profil.prenom} ${profil.nom} (${role.toUpperCase()})`;

    // Logique de blocage Janvier pour élèves
    const mois = new Date().getMonth();
    if (role === 'eleve' && (mois >= 0 && mois <= 7) && !profil.valideParIntendant) {
        main.innerHTML = "<div class='alert-box'><h2>Accès restreint</h2><p>Veuillez régulariser votre scolarité à l'intendance.</p></div>";
        return;
    }

    classesConfig.forEach(cls => {
      // Filtrage par niveau pour l'élève
      if (role === 'eleve' && cls.id !== profil.niveau) return;
      
      // Filtrage par classes affectées pour Prof ou Admin en mode "Mes Classes"
      const hasAccessToClass = (role === 'admin' && viewMode === 'all') || myClasses.includes(cls.id);
      if (!hasAccessToClass) return;

      let subjectHTML = '';
      cls.mats.forEach(mName => {
        const mId = slug(mName);
        const ownsSubject = myMats.includes(mId);

        // En mode "Mes classes" ou rôle Prof, on ne montre que ses matières
        if ((role === 'professeur' || (role === 'admin' && viewMode === 'teacher')) && !ownsSubject) return;

        const canEdit = ownsSubject && isCurrent;

        subjectHTML += `
          <details class="subject">
            <summary>${mName} <span>▼</span></summary>
            <div class="subject-grid">
              <div class="doc-col">
                <h5>📚 Cours</h5><ul class="doc-list" id="list-${viewingYear}-${cls.id}-${mId}-cours"></ul>
                ${canEdit ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','cours')">＋ Ajouter</button>` : ''}
              </div>
              <div class="doc-col">
                <h5>📝 TD</h5><ul class="doc-list" id="list-${viewingYear}-${cls.id}-${mId}-td"></ul>
                ${canEdit ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','td')">＋ Ajouter</button>` : ''}
              </div>
            </div>
          </details>`;
      });

      if (subjectHTML !== '') {
        const div = document.createElement('div');
        div.innerHTML = `<h2 class="cycle-title">${cls.name}</h2><div class="level-content">${subjectHTML}</div>`;
        main.appendChild(div);
        
        cls.mats.forEach(mName => {
            const mId = slug(mName);
            const ownsSubject = myMats.includes(mId);
            if ((role === 'professeur' || (role === 'admin' && viewMode === 'teacher')) && !ownsSubject) return;
            setupListener(viewingYear, cls.id, mId, ownsSubject && isCurrent);
        });
      }
    });
  }

  function setupListener(year, lvl, mat, canDelete) {
    ['cours', 'td'].forEach(type => {
        const ul = document.getElementById(`list-${year}-${lvl}-${mat}-${type}`);
        if (!ul) return;
        const q = query(collection(db, "ressources", year, `${lvl}-${mat}`, type), orderBy("date", "desc"));
        onSnapshot(q, (snap) => {
            ul.innerHTML = snap.empty ? '<li style="background:none;border:none;color:grey">Vide</li>' : '';
            snap.forEach(dDoc => {
                const d = dDoc.data();
                const li = document.createElement('li');
                li.innerHTML = `<a href="${d.url}" target="_blank">📄 ${d.titre}</a>`;
                if (canDelete) {
                    const del = document.createElement('button');
                    del.className = 'delete-btn'; del.innerHTML = '×';
                    del.onclick = () => { if(confirm('Supprimer ?')) deleteDoc(dDoc.ref); };
                    li.appendChild(del);
                }
                ul.appendChild(li);
            });
        });
    });
  }

  window.up = (lvl, mat, type) => {
    const input = document.createElement('input'); input.type = 'file';
    input.onchange = async () => {
      const t = prompt("Titre du fichier :"); if (!t) return;
      document.getElementById('loader-msg').style.display = 'block';
      const fd = new FormData();
      fd.append('file', input.files[0]);
      fd.append('upload_preset', 'lfakm_ressources');
      try {
        const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', { method: 'POST', body: fd });
        const data = await res.json();
        await addDoc(collection(db, "ressources", viewingYear, `${lvl}-${mat}`, type), { titre: t, url: data.secure_url, date: serverTimestamp() });
      } catch (e) { alert("Erreur d'envoi"); }
      finally { document.getElementById('loader-msg').style.display = 'none'; }
    };
    input.click();
  };

  document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
