<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressources Pédagogiques — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A; --ink-deep: #0D1526; --paper: #F9F8F4;
    --brass: #A8853F; --text: #2D3436; --line: rgba(27,42,74,0.1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--paper); line-height:1.5; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  /* HEADER MOBILE FRIENDLY */
  header { background: #fff; border-bottom: 1px solid var(--line); min-height: 80px; padding: 10px 0; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .nav-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand-mark { background: var(--ink); color: #fff; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 6px; }
  .brand-name { font-family: 'Source Serif 4'; font-weight: 700; font-size: 16px; line-height: 1.2; }
  
  nav { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
  nav a { text-decoration: none; color: var(--ink); font-weight: 600; font-size: 13px; }
  .user-badge { color: var(--brass); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 5px; }
  .nav-cta { background: #d9534f; color: #fff !important; padding: 8px 12px; border-radius: 4px; font-size: 12px; }

  /* HERO */
  .hero { background: var(--ink-deep); color: #fff; padding: 40px 0; text-align: center; }
  .hero h1 { font-family: 'Source Serif 4'; font-size: 28px; margin-bottom: 10px; }
  #search-bar { width: 100%; max-width: 500px; padding: 15px; border-radius: 30px; border: none; margin-top: 20px; font-size: 15px; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

  /* DASHBOARD ADMIN (BOUTONS INE / GESTION) */
  #admin-dashboard { 
    display: none; background: #fff; padding: 20px; border-radius: 12px; 
    margin: -20px auto 30px; border: 1px solid var(--line); 
    box-shadow: 0 10px 20px rgba(0,0,0,0.1); position: relative; z-index: 20; 
  }
  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
  .dash-card { 
    display: flex; align-items: center; gap: 12px; padding: 15px; 
    text-decoration: none; border-radius: 8px; color: #fff; transition: 0.3s; 
  }
  .dash-card.ine { background: var(--brass); }
  .dash-card.gest { background: var(--ink-deep); }
