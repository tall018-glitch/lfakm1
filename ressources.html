<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressources pédagogiques — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A;
    --ink-deep: #10192E;
    --paper: #F7F5F0;
    --paper-warm: #F1ECE1;
    --brass: #A8853F;
    --slate: #5B6472;
    --text: #1A1A1A;
    --line: rgba(27,42,74,0.14);
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--sans); color: var(--text); background: #fdfdfb; line-height:1.55; }
  
  .wrap { max-width:1100px; margin:0 auto; padding:0 24px; }

  header { position:sticky; top:0; z-index:1000; background:var(--paper); border-bottom:1px solid var(--line); height: 84px; display: flex; align-items: center; }
  .nav-row { display:flex; align-items:center; justify-content:space-between; width: 100%; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark { width:45px; height:45px; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:800; color:var(--ink); }
  .brand-name { font-family:var(--serif); font-weight:700; font-size:18px; color:var(--ink); }
  nav ul { display:flex; gap:20px; list-style:none; }
  nav a { font-size:14px; font-weight:600; color:var(--ink); }
  .nav-cta { background: var(--ink-deep); color:#fff; padding:10px 18px; border-radius:4px; font-size:13px; font-weight:600; text-decoration:none; cursor: pointer; border:none; }

  .page-hero { background: var(--ink-deep); color:#EFE9DC; padding: 60px 0; text-align: center; }
  .page-hero h1 { font-family:var(--serif); font-size: 32px; margin-bottom: 10px; }

  .search-container { max-width: 600px; margin: -25px auto 40px; padding: 0 20px; }
  #globalSearch { width: 100%; padding: 15px 25px; border-radius: 50px; border: 1px solid var(--line); box-shadow: 0 10px 25px rgba(0,0,0,0.1); font-size: 16px; outline: none; }

  /* Éléments de contenu */
  .cycle-title { font-family: var(--serif); color: var(--ink); margin: 40px 0 15px; border-bottom: 2px solid var(--brass); display: inline-block; padding-bottom: 5px; }
  
  details.level { background: #fff; border: 1px solid var(--line); margin-bottom: 10px; border-radius: 4px; }
  details.level summary { padding: 18px; cursor: pointer; font-family: var(--serif); font-size: 19px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  .level-content { padding: 10px 20px 25px; border-top: 1px solid var(--line); background: #fafafa; }

  details.subject { background: #fff; border: 1px solid var(--line); margin-top: 10px; border-radius: 4px; }
  details.subject summary { padding: 12px; cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; background: #fff; }

  .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 15px; }
  .doc-col h5 { font-size: 11px; text-transform: uppercase; color: var(--brass); margin-bottom: 10px; border-bottom: 1px solid #eee; }
  .doc-list { list-style: none; }
  .doc-list li { background: var(--paper-warm); padding: 10px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #e0ddd5; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center;}
  
  .add-btn { margin-top: 10px; font-size: 11px; font-weight: 700; color: var(--ink); border: 1px dashed var(--brass); padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; background: #fff; }
  .submit-btn { background: var(--brass); color: #fff; border: none; padding: 5px 10px; border-radius: 3px; font-size: 11px; cursor: pointer; margin-top: 5px; }
  .delete-btn { color: #a83f3f; cursor: pointer; border: none; background: none; font-weight: bold; padding: 5px; }

  footer { background: var(--ink-deep); color: #B7BCC9; padding: 40px; text-align: center; font-size: 13px; margin-top: 50px; }
</style>
</head>
<body>

<header>
  <div class="wrap nav-row">
    <div class="brand">
      <div class="brand-mark">LFAKM</div>
      <div class="brand-name">Lycée Franco Arabe de Keur Madiabel</div>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="ressources.html">Ressources</a></li>
        <li><a href="#" id="auth-btn" class="nav-cta">Connexion</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <h1 id="hero-title">Ressources Pédagogiques</h1>
    <p id="welcome-msg">Accédez aux cours et gérez les travaux dirigés en ligne.</p>
  </div>
</section>

<div class="search-container">
  <input type="text" id="globalSearch" placeholder="Rechercher une matière ou une classe...">
</div>

<main class="wrap" id="main-content">
  <!-- LE CONTENU APPARAÎTRA ICI -->
</main>

<footer>© 2026 Lycée Franco Arabe de Keur Madiabel</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
    authDomain: "lfakm-87dec.firebaseapp.com",
    projectId: "lfakm-87dec",
    storageBucket: "lfakm-87dec.firebasestorage.app",
    messagingSenderId: "739517262614",
    appId: "1:739517262614:web:14abd3538427960c527e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // LA STRUCTURE EXACTE DES DONNÉES
  const classes = [
    { cycle: "Collège", id: "sixieme", name: "Sixième", mats: ["Français", "Anglais", "Arabe", "Mathématiques", "SVT", "Histoire-Géo", "Religieux"] },
    { cycle: "Collège", id: "cinquieme", name: "Cinquième", mats: ["Français", "Anglais", "Arabe", "Mathématiques", "SVT", "Histoire-Géo", "Religieux"] },
    { cycle: "Collège", id: "quatrieme", name: "Quatrième", mats: ["Français", "Anglais", "Mathématiques", "PC", "SVT", "Histoire-Géo"] },
    { cycle: "Collège", id: "troisieme", name: "Troisième", mats: ["Français", "Anglais", "Mathématiques", "PC", "SVT", "Histoire-Géo"] },
    { cycle: "Lycée", id: "seconde-serie-s2a", name: "Seconde S2A", mats: ["Mathématiques", "PC", "SVT", "Français", "Anglais", "Histoire-Géo", "Arabe"] },
    { cycle: "Lycée", id: "seconde-serie-la", name: "Seconde LA", mats: ["Français", "Anglais", "Histoire-Géo", "Arabe", "Mathématiques"] },
    { cycle: "Lycée", id: "premiere-serie-s2a", name: "Première S2A", mats: ["Mathématiques", "PC", "SVT", "Français", "Anglais", "Histoire-Géo", "Arabe"] },
    { cycle: "Lycée", id: "premiere-serie-la", name: "Première LA", mats: ["Français", "Anglais", "Histoire-Géo", "Arabe", "Philosophie"] },
    { cycle: "Lycée", id: "terminale-serie-s2a", name: "Terminale S2A", mats: ["Mathématiques", "PC", "SVT", "Philosophie", "Français", "Anglais"] },
    { cycle: "Lycée", id: "terminale-serie-la", name: "Terminale LA", mats: ["Philosophie", "Français", "Anglais", "Histoire-Géo", "Arabe"] }
  ];

  function slugify(t) { return t.toLowerCase().replace(/ /g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

  function render(userProfil) {
    const main = document.getElementById('main-content');
    main.innerHTML = '';
    
    const role = userProfil?.role || 'visiteur';
    const myLevel = userProfil?.niveau;
    const myMats = userProfil?.disciplines || [];

    // On sépare par cycle
    ["Collège", "Lycée"].forEach(cycleName => {
      const section = document.createElement('div');
      let hasContent = false;

      classes.filter(c => c.cycle === cycleName).forEach(cls => {
        // Filtre ÉLÈVE : ne voit que son niveau
        if (role === 'eleve' && cls.id !== myLevel) return;

        let subjectHTML = '';
        let hasSubject = false;

        cls.mats.forEach(m => {
          const mId = slugify(m);
          // Filtre PROFESSEUR : ne voit que ses matières
          if (role === 'professeur' && !myMats.includes(mId)) return;

          hasSubject = true;
          const editMode = (role === 'professeur' && myMats.includes(mId));

          subjectHTML += `
            <details class="subject">
              <summary>${m} <span>▼</span></summary>
              <div class="subject-grid">
                <div class="doc-col">
                  <h5>Cours</h5>
                  <ul class="doc-list" id="l-${cls.id}-${mId}-cours"></ul>
                  ${editMode ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','cours')">+ Ajouter Cours</button>` : ''}
                </div>
                <div class="doc-col">
                  <h5>Exercices / TD</h5>
                  <ul class="doc-list" id="l-${cls.id}-${mId}-td"></ul>
                  ${editMode ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','td')">+ Ajouter TD</button>` : ''}
                </div>
                <div class="doc-col">
                  <h5>Devoirs à rendre</h5>
                  <ul class="doc-list" id="l-${cls.id}-${mId}-dev"></ul>
                  ${editMode ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','dev')">+ Créer un devoir</button>` : ''}
                </div>
              </div>
            </details>`;
        });

        if (hasSubject) {
          hasContent = true;
          const levelBox = document.createElement('details');
          levelBox.className = 'level';
          if (role === 'eleve') levelBox.open = true;
          levelBox.innerHTML = `<summary>${cls.name} <span>＋</span></summary><div class="level-content">${subjectHTML}</div>`;
          section.appendChild(levelBox);

          // Lancement des écouteurs
          cls.mats.forEach(m => {
            const mId = slugify(m);
            if (role === 'professeur' && !myMats.includes(mId)) return;
            setupList(cls.id, mId, 'cours', userProfil);
            setupList(cls.id, mId, 'td', userProfil);
            setupList(cls.id, mId, 'dev', userProfil);
          });
        }
      });

      if (hasContent) {
        const title = document.createElement('h2');
        title.className = 'cycle-title';
        title.textContent = cycleName;
        main.appendChild(title);
        main.appendChild(section);
      }
    });
  }

  function setupList(lvl, mat, type, profil) {
    const ul = document.getElementById(`l-${lvl}-${mat}-${type}`);
    if(!ul) return;
    const q = query(collection(db, "ressources", `${lvl}-${mat}`, type), orderBy("date", "desc"));
    onSnapshot(q, (snap) => {
      ul.innerHTML = snap.empty ? '<li style="background:none;border:none;color:grey;font-style:italic">Aucun contenu</li>' : '';
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const li = document.createElement('li');
        li.innerHTML = `<div><a href="${d.url}" target="_blank">📄 ${d.titre}</a></div>`;
        
        if (type === 'dev' && profil?.role === 'eleve') {
           const btn = document.createElement('button');
           btn.className = 'submit-btn';
           btn.textContent = "Rendre mon devoir";
           btn.onclick = () => window.rendu(lvl, mat, d.titre, profil);
           li.appendChild(btn);
        }

        if (profil?.role === 'professeur' && profil.disciplines.includes(mat)) {
          const del = document.createElement('button');
          del.className = 'delete-btn'; del.textContent = '×';
          del.onclick = () => { if(confirm('Supprimer ?')) deleteDoc(docSnap.ref); };
          li.appendChild(del);
        }
        ul.appendChild(li);
      });
    });
  }

  // Fonctions Globales
  window.up = async (lvl, mat, type) => {
    const t = prompt("Titre :"); if(!t) return;
    const i = document.createElement('input'); i.type = 'file';
    i.onchange = async () => {
      const fd = new FormData(); fd.append('file', i.files[0]); fd.append('upload_preset', 'lfakm_ressources');
      const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', {method:'POST', body:fd});
      const data = await res.json();
      await addDoc(collection(db, "ressources", `${lvl}-${mat}`, type), { titre: t, url: data.secure_url, date: serverTimestamp() });
    };
    i.click();
  };

  window.rendu = async (lvl, mat, titreDev, p) => {
    const i = document.createElement('input'); i.type = 'file';
    i.onchange = async () => {
      alert("Envoi en cours...");
      const fd = new FormData(); fd.append('file', i.files[0]); fd.append('upload_preset', 'lfakm_ressources');
      const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', {method:'POST', body:fd});
      const data = await res.json();
      await addDoc(collection(db, "devoirs_rendus"), { 
        eleve: p.prenom+' '+p.nom, classe: lvl, matiere: mat, devoir: titreDev, url: data.secure_url, date: serverTimestamp() 
      });
      alert("Devoir rendu avec succès !");
    };
    i.click();
  };

  onAuthStateChanged(auth, async (user) => {
    const btn = document.getElementById('auth-btn');
    if (user) {
      const snap = await getDoc(doc(db, 'utilisateurs', user.uid));
      const p = snap.data();
      document.getElementById('welcome-msg').textContent = `Session : ${p.prenom} ${p.nom} (${p.role})`;
      btn.textContent = "Déconnexion";
      btn.onclick = () => signOut(auth).then(() => location.reload());
      render(p);
    } else {
      render(null);
      btn.onclick = () => window.location.href = 'identification.html';
    }
  });

  // Recherche
  document.getElementById('globalSearch').oninput = (e) => {
    const v = e.target.value.toLowerCase();
    document.querySelectorAll('.level, .subject').forEach(el => {
      el.style.display = el.textContent.toLowerCase().includes(v) ? '' : 'none';
    });
  };
</script>
</body>
</html>
