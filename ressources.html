<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressources — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A; --ink-deep: #10192E; --paper: #F7F5F0; --brass: #A8853F;
    --slate: #5B6472; --text: #1A1A1A; --line: rgba(27,42,74,0.1);
    --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--sans); color: var(--text); background: var(--paper); line-height:1.5; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 20px; }

  /* Header */
  header { background:#fff; border-bottom:1px solid var(--line); height: 80px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; }
  .nav-row { display:flex; align-items:center; justify-content:space-between; width: 100%; }
  .brand-name { font-family:var(--serif); font-weight:700; font-size:18px; color:var(--ink); }
  nav ul { display:flex; gap:15px; list-style:none; }
  nav a { font-size:13px; font-weight:600; color:var(--ink); text-decoration: none; }
  .nav-cta { background: var(--ink); color:#fff; padding:8px 15px; border-radius:5px; font-size:12px; border:none; cursor:pointer; }

  /* Hero */
  .page-hero { background: var(--ink-deep); color: #fff; padding: 40px 0; text-align: center; }
  .page-hero h1 { font-family: var(--serif); font-size: 28px; margin-bottom: 10px; }
  #welcome-msg { color: #C7CBD6; font-size: 14px; margin-bottom: 15px; }

  /* Fenêtre de configuration des matières */
  #setup-box { background: #fff; border: 2px solid var(--brass); padding: 20px; border-radius: 10px; margin: 20px auto; max-width: 500px; display: none; text-align: left; }
  .check-item { display: block; margin: 10px 0; font-size: 14px; cursor: pointer; }

  /* Accordéons */
  .cycle-title { font-family: var(--serif); color: var(--ink); margin: 30px 0 10px; border-bottom: 2px solid var(--brass); display: inline-block; }
  details.level { background: #fff; border: 1px solid var(--line); margin-bottom: 8px; border-radius: 5px; }
  details.level summary { padding: 15px; cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  .level-content { padding: 10px; background: #fafafa; }
  details.subject { background: #fff; border: 1px solid var(--line); margin-top: 5px; border-radius: 5px; }
  details.subject summary { padding: 10px; font-size: 14px; background: #fff; }

  /* Grille Cours/TD */
  .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; padding: 10px; }
  .doc-col h5 { font-size: 11px; text-transform: uppercase; color: var(--brass); margin-bottom: 8px; }
  .doc-list { list-style: none; font-size: 13px; }
  .doc-list li { background: #eee; padding: 8px; border-radius: 4px; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .add-btn { background: #fff; border: 1px dashed var(--brass); padding: 5px; font-size: 11px; cursor: pointer; width: 100%; margin-top: 5px; }
  .delete-btn { color: red; font-weight: bold; cursor: pointer; border: none; background: none; }
</style>
</head>
<body>

<header>
  <div class="wrap nav-row">
    <div class="brand-name">LFAKM - Ressources</div>
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="#" id="logout-btn" class="nav-cta">Déconnexion</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <h1>Espace Pédagogique</h1>
    <p id="welcome-msg">Chargement de votre profil...</p>
    <button id="edit-profile-btn" class="nav-cta" style="display:none; background:var(--brass);">Modifier mes matières</button>
  </div>
</section>

<!-- Boite de configuration (cachée par défaut) -->
<div class="wrap">
  <div id="setup-box">
    <h3 style="margin-bottom:15px;">Sélectionnez vos matières :</h3>
    <div id="mats-list">
        <!-- Rempli par JS -->
    </div>
    <button id="save-mats-btn" class="nav-cta" style="width:100%; margin-top:15px;">Enregistrer et Actualiser</button>
  </div>
</div>

<main class="wrap" id="main-content"></main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
    authDomain: "lfakm-87dec.firebaseapp.com",
    projectId: "lfakm-87dec",
    storageBucket: "lfakm-87dec.firebasestorage.app",
    messagingSenderId: "739517262614",
    appId: "1:739517262614:web:14abd3538427960c527e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const availableSubjects = [
    {id: "francais", n: "Français"},
    {id: "anglais", n: "Anglais"},
    {id: "mathematiques", n: "Mathématiques"},
    {id: "sciences-physiques", n: "Physique-Chimie"},
    {id: "sciences-de-la-vie-et-de-la-terre", n: "SVT"},
    {id: "histoire-geo", n: "Histoire-Géo"},
    {id: "philosophie", n: "Philosophie"},
    {id: "arabe-tsq-arabe-et-redaction", n: "Arabe"}
  ];

  const classes = [
    { cycle: "Collège", id: "sixieme", name: "Sixième", mats: ["Français", "Anglais", "Arabe", "Mathématiques", "SVT", "Histoire-Géo"] },
    { cycle: "Collège", id: "cinquieme", name: "Cinquième", mats: ["Français", "Anglais", "Arabe", "Mathématiques", "SVT", "Histoire-Géo"] },
    { cycle: "Collège", id: "quatrieme", name: "Quatrième", mats: ["Français", "Anglais", "Mathématiques", "Sciences Physiques", "SVT", "Histoire-Géo"] },
    { cycle: "Collège", id: "troisieme", name: "Troisième", mats: ["Français", "Anglais", "Mathématiques", "Sciences Physiques", "SVT", "Histoire-Géo"] },
    { cycle: "Lycée", id: "seconde-serie-s2a", name: "Seconde S2A", mats: ["Mathématiques", "Sciences Physiques", "SVT", "Français", "Anglais", "Histoire-Géo"] },
    { cycle: "Lycée", id: "terminale-serie-s2a", name: "Terminale S2A", mats: ["Mathématiques", "Sciences Physiques", "SVT", "Philosophie", "Français"] }
  ];

  function slugify(t) { 
      if(!t) return "";
      return t.toLowerCase().trim().replace(/ /g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
  }

  function render(profil) {
    const main = document.getElementById('main-content');
    main.innerHTML = '';
    const role = profil?.role || 'visiteur';
    const myMats = profil?.disciplines || []; // On utilise le d minuscule ici
    const myLevel = profil?.niveau;

    classes.forEach(cls => {
      if (role === 'eleve' && cls.id !== myLevel) return;

      let subjectHTML = '';
      let hasVisibleSub = false;

      cls.mats.forEach(mName => {
        const mId = slugify(mName);
        const canEdit = (role === 'professeur' && myMats.includes(mId));
        
        // Si c'est un prof, on ne montre que ses matières. Si c'est un élève ou visiteur, on montre tout.
        if (role === 'professeur' && !canEdit) return;

        hasVisibleSub = true;
        subjectHTML += `
          <details class="subject">
            <summary>${mName} <span>▼</span></summary>
            <div class="subject-grid">
              <div class="doc-col">
                <h5>Cours</h5>
                <ul class="doc-list" id="l-${cls.id}-${mId}-cours"></ul>
                ${canEdit ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','cours')">＋ Ajouter</button>` : ''}
              </div>
              <div class="doc-col">
                <h5>Exercices / TD</h5>
                <ul class="doc-list" id="l-${cls.id}-${mId}-td"></ul>
                ${canEdit ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','td')">＋ Ajouter</button>` : ''}
              </div>
            </div>
          </details>`;
      });

      if (hasVisibleSub) {
        const div = document.createElement('div');
        div.innerHTML = `<h2 class="cycle-title">${cls.name}</h2><details open class="level"><div class="level-content">${subjectHTML}</div></details>`;
        main.appendChild(div);
        
        // Activer les écouteurs
        cls.mats.forEach(mName => {
            const mId = slugify(mName);
            if (role === 'professeur' && !myMats.includes(mId)) return;
            setupList(cls.id, mId, 'cours', profil);
            setupList(cls.id, mId, 'td', profil);
        });
      }
    });
  }

  function setupList(lvl, mat, type, profil) {
    const ul = document.getElementById(`l-${lvl}-${mat}-${type}`);
    if(!ul) return;
    const q = query(collection(db, "ressources", `${lvl}-${mat}`, type), orderBy("date", "desc"));
    onSnapshot(q, (snap) => {
      ul.innerHTML = snap.empty ? '<li style="color:grey; font-style:italic; background:none; border:none;">Vide</li>' : '';
      snap.forEach(dDoc => {
        const d = dDoc.data();
        const li = document.createElement('li');
        li.innerHTML = `<a href="${d.url}" target="_blank">${d.titre}</a>`;
        if (profil?.role === 'professeur') {
          const del = document.createElement('button');
          del.className = 'delete-btn'; del.textContent = '×';
          del.onclick = () => { if(confirm('Supprimer ?')) deleteDoc(dDoc.ref); };
          li.appendChild(del);
        }
        ul.appendChild(li);
      });
    });
  }

  // --- ACTIONS PROFESSEUR ---
  window.up = async (lvl, mat, type) => {
    const t = prompt("Titre du document :"); if(!t) return;
    const i = document.createElement('input'); i.type = 'file';
    i.onchange = async () => {
      const fd = new FormData(); fd.append('file', i.files[0]); fd.append('upload_preset', 'lfakm_ressources');
      const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', {method:'POST', body:fd});
      const data = await res.json();
      await addDoc(collection(db, "ressources", `${lvl}-${mat}`, type), { titre: t, url: data.secure_url, date: serverTimestamp() });
    };
    i.click();
  };

  // --- CONFIGURATION PROFIL ---
  const editBtn = document.getElementById('edit-profile-btn');
  const setupBox = document.getElementById('setup-box');
  
  editBtn.onclick = () => {
      setupBox.style.display = (setupBox.style.display === 'block') ? 'none' : 'block';
      const listDiv = document.getElementById('mats-list');
      listDiv.innerHTML = availableSubjects.map(s => `
        <label class="check-item"><input type="checkbox" name="prof-mats" value="${s.id}"> ${s.n}</label>
      `).join('');
  };

  document.getElementById('save-mats-btn').onclick = async () => {
    const selected = Array.from(document.querySelectorAll('input[name="prof-mats"]:checked')).map(cb => cb.value);
    if(selected.length === 0) return alert("Choisissez au moins une matière.");
    await updateDoc(doc(db, 'utilisateurs', auth.currentUser.uid), {
        disciplines: selected, // On l'enregistre en minuscule
        Disciplines: null // On efface l'ancien champ avec la majuscule pour nettoyer
    });
    alert("Profil mis à jour !");
    location.reload();
  };

  // --- AUTH ---
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, 'utilisateurs', user.uid));
      const p = snap.data();
      // Correction automatique si le champ disciplines n'existe pas encore ou est mal nommé
      const myDisciplines = p.disciplines || p.Disciplines || [];
      
      document.getElementById('welcome-msg').textContent = `Session : ${p.prenom} ${p.nom} (${p.role})`;
      if (p.role === 'professeur') {
          editBtn.style.display = 'inline-block';
          if (myDisciplines.length === 0) setupBox.style.display = 'block';
      }
      render({ ...p, disciplines: Array.isArray(myDisciplines) ? myDisciplines : [myDisciplines] });
    } else {
      window.location.href = 'identification.html';
    }
  });

  document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());

</script>
</body>
</html>
