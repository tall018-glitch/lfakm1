<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressources pédagogiques — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A;
    --ink-deep: #10192E;
    --paper: #F7F5F0;
    --paper-warm: #F1ECE1;
    --brass: #A8853F;
    --slate: #5B6472;
    --text: #1A1A1A;
    --line: rgba(27,42,74,0.14);
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family: var(--sans); color: var(--text); line-height:1.55;
    background: linear-gradient(180deg, rgba(16,25,46,0.05), rgba(247,245,240,0.8));
    background-attachment: fixed;
  }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 32px; }

  header { position:sticky; top:0; z-index:100; background:var(--paper); border-bottom:1px solid var(--line); box-shadow: var(--shadow); }
  .nav-row { display:flex; align-items:center; justify-content:space-between; height:84px; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand-mark { width:44px; height:44px; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:600; color:var(--ink); }
  .brand-name { font-family:var(--serif); font-weight:600; font-size:18px; color:var(--ink); }
  nav ul { display:flex; gap:25px; list-style:none; }
  nav a { font-size:14px; font-weight:500; color:var(--ink); }
  nav a:hover { color: var(--brass); }
  .nav-cta { background: var(--ink); color:#fff; padding:10px 20px; font-size:13px; font-weight:600; border-radius:4px; }

  .page-hero { background: var(--ink-deep); color:#EFE9DC; padding: 60px 0; text-align: center; }
  .page-hero h1 { font-family:var(--serif); font-size: clamp(24px, 4vw, 36px); margin-bottom: 10px; }
  .page-hero p { color:#C7CBD6; max-width:700px; margin:0 auto; font-size: 15px; padding: 0 20px; }

  .search-section { margin-top: -30px; margin-bottom: 40px; position: relative; z-index: 10; }
  #search-bar { 
    width: 100%; max-width: 600px; margin: 0 auto; display: block;
    padding: 18px 25px; border-radius: 50px; border: 1px solid var(--line);
    box-shadow: 0 10px 25px rgba(0,0,0,0.1); font-size: 16px; outline: none;
  }

  .cycle-title { border-left: 4px solid var(--brass); padding-left: 15px; margin: 40px 0 20px; font-family: var(--serif); color: var(--ink); }
  
  details.level { background:#fff; border:1px solid var(--line); margin-bottom:12px; border-radius: 8px; overflow: hidden; }
  details.level > summary { list-style:none; cursor:pointer; padding:22px 24px; display:flex; align-items:center; justify-content:space-between; }
  .level-name { font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink); }
  .level-meta { font-size:12px; color:var(--slate); text-transform:uppercase; }

  .level-body { padding: 10px 24px 24px; background: #fafafa; border-top: 1px solid var(--line); }
  details.subject { background:#fff; border:1px solid var(--line); margin-top: 10px; border-radius: 6px; }
  details.subject > summary { list-style:none; cursor:pointer; padding:15px; font-weight:600; display:flex; justify-content:space-between; }
  
  .subject-body { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:20px; padding: 20px; }
  .doc-col h5 { font-size:11px; text-transform:uppercase; color:var(--brass); margin-bottom:12px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
  
  .doc-list { list-style:none; display:flex; flex-direction:column; gap:8px; }
  .doc-list li { 
    font-size:13px; padding:10px; background:var(--paper-warm); border:1px solid var(--line); border-radius: 4px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .doc-list li a { flex: 1; margin-right: 10px; }
  
  .add-doc { display: inline-block; margin-top: 10px; font-size:11px; font-weight:700; color:var(--ink); border: 1px dashed var(--brass); padding: 6px 10px; border-radius: 4px; }
  .doc-delete { color:#a83f3f; font-size:10px; font-weight:700; cursor:pointer; border:none; background:none; }

  footer { background: var(--ink-deep); color:#B7BCC9; padding: 40px; text-align:center; font-size:13px; margin-top: 60px; }
</style>
</head>
<body>

<header>
  <div class="wrap nav-row">
    <div class="brand">
      <div class="brand-mark">LFAKM</div>
      <div class="brand-name">Lycée Franco Arabe</div>
    </div>
    <nav>
      <ul id="nav-list">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="ressources.html" style="color:var(--brass)">Ressources</a></li>
        <li><a href="identification.html" id="login-link">Connexion</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <h1>Espace Pédagogique</h1>
    <p>Supports de cours et travaux dirigés classés par niveau.</p>
  </div>
</section>

<div class="wrap search-section">
  <input type="text" id="search-bar" placeholder="Rechercher une matière (ex: Maths)...">
</div>

<div class="wrap" id="main-content">

</div>

<footer>© 2026 Lycée Franco Arabe de Keur Madiabel</footer>

    }
  ];

  function renderStructure() {
    const container = document.getElementById('main-content');
    let html = '';
    dataStructure.forEach(cycle => {
      html += `<h2 class="cycle-title">${cycle.cycle}</h2>`;

            <div class="level-body">
              ${lvl.subjects.map(sub => {
                const subId = sub.toLowerCase().replace(/ /g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                return `
                <details class="subject">
                  <summary>${sub} <span>+</span></summary>
                  <div class="subject-body">
                    <div class="doc-col">
                      <h5>Cours</h5>
                      <ul class="doc-list" id="cours-${lvl.id}-${subId}"><li class="doc-empty">Chargement...</li></ul>
                      <a href="#" class="add-doc" style="display:none;" data-target="cours-${lvl.id}-${subId}">+ Ajouter</a>
                    </div>
                    <div class="doc-col">
                      <h5>TD / Exercices</h5>
                      <ul class="doc-list" id="td-${lvl.id}-${subId}"><li class="doc-empty">Chargement...</li></ul>
                      <a href="#" class="add-doc" style="display:none;" data-target="td-${lvl.id}-${subId}">+ Ajouter</a>
                    </div>
                  </div>
                </details>`;
              }).join('')}
            </div>
          </details>`;
      });
    });
    container.innerHTML = html;
  }

  renderStructure();

  let currentUser = null;
  let currentProfil = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, 'utilisateurs', user.uid));
      currentProfil = snap.exists() ? snap.data() : null;
      document.getElementById('login-link').textContent = "Déconnexion";
      document.getElementById('login-link').onclick = () => signOut(auth).then(() => window.location.reload());
    }
    setupLogic();
  });
