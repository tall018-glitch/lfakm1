<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Pédagogique — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1B2A4A; --ink-deep: #10192E; --paper: #F7F5F0; --brass: #A8853F; --slate: #5B6472; --text: #1A1A1A; --line: rgba(27,42,74,0.14); --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter', sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--sans); color: var(--text); background: #f4f2ed; line-height:1.55; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 24px; }

  /* NAVIGATION */
  header { background: #fff; border-bottom: 1px solid var(--line); height: 75px; display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; }
  .nav-row { display:flex; align-items:center; justify-content:space-between; width: 100%; }
  .brand-name { font-family:var(--serif); font-weight:700; font-size:18px; color:var(--ink); text-decoration:none; }
  .nav-cta { background: var(--ink); color:#fff; padding:8px 15px; border-radius:5px; font-size:12px; border:none; cursor:pointer; text-decoration: none;}

  /* BARRES DE CONTRÔLE (Archives & Admin) */
  .control-panel { background: var(--ink-deep); color: white; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .archive-bar { padding: 10px 0; text-align: center; font-size: 13px; }
  .archive-bar select { background: white; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 10px; }
  
  #admin-toolbar { background: var(--brass); color: white; padding: 10px 0; display: none; text-align: center; }
  .switch-btn { background: rgba(255,255,255,0.2); border: 1px solid #fff; color: white; padding: 5px 15px; margin: 0 5px; cursor: pointer; border-radius: 20px; font-size: 11px; font-weight: bold; text-decoration: none; }
  .switch-btn.active { background: white; color: var(--brass); }

  /* HERO */
  .page-hero { background: var(--ink-deep); color: #fff; padding: 40px 0; text-align: center; }
  .page-hero h1 { font-family: var(--serif); font-size: 30px; margin-bottom: 5px; }
  #session-info { color: #C7CBD6; font-size: 14px; }

  /* ACCORDÉONS */
  .cycle-title { font-family: var(--serif); color: var(--ink); margin: 30px 0 10px; border-bottom: 2px solid var(--brass); display: inline-block; padding-bottom: 5px; }
  details.level { background: #fff; border: 1px solid var(--line); margin-bottom: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
  details.level summary { padding: 18px 25px; cursor: pointer; font-family: var(--serif); font-size: 19px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  .level-content { padding: 5px 20px 25px; background: #fafafa; border-top: 1px solid var(--line); }

  details.subject { background: #fff; border: 1px solid var(--line); margin-top: 10px; border-radius: 6px; }
  details.subject summary { padding: 12px 15px; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; color: var(--ink); }

  /* GRILLE DOCUMENTS */
  .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; padding: 10px; }
  .doc-col { background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #eee; }
  .doc-col h5 { font-size: 11px; text-transform: uppercase; color: var(--brass); margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 4px; }
  .doc-list { list-style: none; }
  .doc-list li { background: #f1ece1; padding: 8px 12px; border-radius: 4px; margin-bottom: 6px; border: 1px solid #e0ddd5; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  
  .add-btn { margin-top: 8px; font-size: 10px; font-weight: 700; color: #fff; background: var(--ink); border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; }
  .delete-btn { color: #d9534f; cursor: pointer; border: none; background: none; font-weight: bold; font-size: 18px; }
  
  #loader-msg { color: #FFD700; font-weight: bold; display: none; text-align: center; padding: 10px; background: var(--ink-deep); }
  .alert-box { background: white; padding: 40px; border-radius: 10px; text-align: center; border: 1px solid var(--line); margin-top: 40px; box-shadow: var(--shadow); }
</style>
</head>
<body>

<div class="control-panel">
    <div class="archive-bar">
        Année Scolaire : 
        <select id="year-selector">
            <!-- Rempli dynamiquement -->
        </select>
    </div>
    <div id="admin-toolbar">
        <span style="margin-right:15px; font-size:12px; font-weight: bold;">PROVISEUR :</span>
        <button class="switch-btn active" id="view-all">Toutes les Classes (Lecture)</button>
        <button class="switch-btn" id="view-teacher">Mes Classes & Matières (Édition)</button>
        <a href="admin-gestion.html" class="switch-btn">Gestion des Comptes</a>
    </div>
</div>

<header>
    <div class="wrap nav-row">
        <a href="index.html" class="brand-name">LFAKM - Portail Numérique</a>
        <nav><a href="#" id="logout-btn" class="nav-cta">Déconnexion</a></nav>
    </div>
</header>

<div id="loader-msg">Action en cours... veuillez patienter.</div>

<section class="page-hero">
    <div class="wrap">
        <h1>Ressources Pédagogiques</h1>
        <p id="session-info">Initialisation du profil...</p>
    </div>
</section>

<main class="wrap" id="main-content"></main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
    authDomain: "lfakm-87dec.firebaseapp.com",
    projectId: "lfakm-87dec",
    storageBucket: "lfakm-87dec.firebasestorage.app",
    messagingSenderId: "739517262614",
    appId: "1:739517262614:web:14abd3538427960c527e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const classesConfig = [
    { id: "sixieme", name: "6ème", mats: ["Français", "Anglais", "Mathématiques", "SVT", "Histoire-Géo", "Religieux"] },
    { id: "cinquieme", name: "5ème", mats: ["Français", "Anglais", "Mathématiques", "SVT", "Histoire-Géo", "Religieux"] },
    { id: "quatrieme", name: "4ème", mats: ["Mathématiques", "Sciences Physiques", "Français", "Anglais", "SVT"] },
    { id: "troisieme", name: "3ème", mats: ["Mathématiques", "Sciences Physiques", "Français", "Anglais", "SVT"] },
    { id: "seconde-serie-s2a", name: "Seconde S2A", mats: ["Mathématiques", "Sciences Physiques", "SVT", "Français"] },
    { id: "premiere-serie-s2a", name: "Première S2A", mats: ["Mathématiques", "Sciences Physiques", "SVT", "Histoire-Géo"] },
    { id: "terminale-serie-s2a", name: "Terminale S2A", mats: ["Mathématiques", "Sciences Physiques", "SVT", "Philosophie"] }
  ];

  let profil = null;
  let currentSchoolYear = "";
  let viewingYear = "";
  let viewMode = 'all'; // 'all' ou 'teacher'

  function slug(t) { return t.toLowerCase().trim().replace(/ /g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

  // 1. DÉMARRAGE ET AUTHENTIFICATION
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, 'utilisateurs', user.uid));
      profil = snap.data();

      if (profil.role !== 'eleve' && profil.compteActive !== true) {
        document.getElementById('main-content').innerHTML = "<div class='alert-box'><h2>Compte Inactif</h2><p>Votre compte doit être validé par le Proviseur.</p></div>";
        return;
      }

      // Récupérer l'année scolaire de référence
      const configSnap = await getDoc(doc(db, "config", "schoolYear"));
      currentSchoolYear = configSnap.data()?.year || "2025-2026";
      viewingYear = currentSchoolYear;

      initYearSelector();
      if (profil.role === 'admin') {
          document.getElementById('admin-toolbar').style.display = 'block';
          setupAdminButtons();
      }

      render();
    } else { window.location.href = "identification.html"; }
  });

  // 2. SÉLECTEUR D'ANNÉE
  function initYearSelector() {
      const sel = document.getElementById('year-selector');
      // On génère quelques années d'archives pour l'exemple
      const years = [currentSchoolYear, "2024-2025", "2023-2024"];
      sel.innerHTML = years.map(y => `<option value="${y}">${y}${y === currentSchoolYear ? ' (Actuelle)' : ' (Archive)'}</option>`).join('');
      sel.onchange = (e) => {
          viewingYear = e.target.value;
          render();
      };
  }

  // 3. BOUTONS ADMIN
  function setupAdminButtons() {
      document.getElementById('view-all').onclick = function() {
          viewMode = 'all';
          this.classList.add('active');
          document.getElementById('view-teacher').classList.remove('active');
          render();
      };
      document.getElementById('view-teacher').onclick = function() {
          viewMode = 'teacher';
          this.classList.add('active');
          document.getElementById('view-all').classList.remove('active');
          render();
      };
  }

  // 4. RENDU DE L'INTERFACE
  function render() {
    const main = document.getElementById('main-content');
    main.innerHTML = '';
    const isArchive = (viewingYear !== currentSchoolYear);
    
    // Message de bienvenue
    const mois = new Date().getMonth(); // 0 = Janvier, 8 = Septembre
    const periodeGrace = (mois >= 8 && mois <= 11); // Septembre à Décembre
    const bloqueScolarite = (profil.role === 'eleve' && !periodeGrace && !profil.valideParIntendant);

    document.getElementById('session-info').textContent = `Session : ${profil.prenom} ${profil.nom} (${profil.role.toUpperCase()}) | Année : ${viewingYear}`;

    if (bloqueScolarite) {
        main.innerHTML = `<div class="alert-box"><h2>Accès Bloqué</h2><p>L'accès aux ressources est suspendu. Veuillez régulariser vos frais d'inscription à l'intendance pour débloquer le second semestre.</p></div>`;
        return;
    }

    classesConfig.forEach(cls => {
      // Filtre Élève
      if (profil.role === 'eleve' && cls.id !== profil.niveau) return;
      
      // Filtre Professeur (ou Admin en mode enseignant)
      const aAccesAClasse = profil.assignedClasses?.includes(cls.id);
      if ((profil.role === 'professeur' || (profil.role === 'admin' && viewMode === 'teacher')) && !aAccesAClasse) return;

      let subjectHTML = '';
      cls.mats.forEach(mName => {
        const mId = slug(mName);
        const isMySubject = profil.disciplines?.includes(mId);

        if ((profil.role === 'professeur' || (profil.role === 'admin' && viewMode === 'teacher')) && !isMySubject) return;

        const canEdit = isMySubject && !isArchive;

        subjectHTML += `
          <details class="subject">
            <summary>${mName} <span>▼</span></summary>
            <div class="subject-grid">
              <div class="doc-col">
                <h5>📚 Cours</h5>
                <ul class="doc-list" id="l-${viewingYear}-${cls.id}-${mId}-cours"></ul>
                ${canEdit ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','cours')">＋ Ajouter</button>` : ''}
              </div>
              <div class="doc-col">
                <h5>📝 TD / Exercices</h5>
                <ul class="doc-list" id="l-${viewingYear}-${cls.id}-${mId}-td"></ul>
                ${canEdit ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','td')">＋ Ajouter</button>` : ''}
              </div>
            </div>
          </details>`;
      });

      if (subjectHTML !== '') {
        const div = document.createElement('div');
        div.innerHTML = `<h2 class="cycle-title">${cls.name}</h2><div class="level-content">${subjectHTML}</div>`;
        main.appendChild(div);
        
        cls.mats.forEach(mName => {
            const mId = slug(mName);
            // On lance l'écoute des données
            setupListListener(viewingYear, cls.id, mId, profil, !isArchive);
        });
      }
    });
  }

  // 5. ÉCOUTEUR FIRESTORE (TEMPS RÉEL)
  function setupListListener(year, lvl, mat, userProfil, isCurrent) {
    ['cours', 'td'].forEach(type => {
        const ul = document.getElementById(`l-${year}-${lvl}-${mat}-${type}`);
        if (!ul) return;

        // Chemin : ressources > [Année] > [Classe-Matiere] > [Type]
        const q = query(collection(db, "ressources", year, `${lvl}-${mat}`, type), orderBy("date", "desc"));
        
        onSnapshot(q, (snap) => {
            ul.innerHTML = snap.empty ? '<li style="background:none;border:none;color:grey">Aucun fichier</li>' : '';
            snap.forEach(docSnap => {
                const d = docSnap.data();
                const li = document.createElement('li');
                li.innerHTML = `<a href="${d.url}" target="_blank">📄 ${d.titre}</a>`;
                
                // On peut supprimer si c'est l'année actuelle et que c'est notre matière
                if (isCurrent && userProfil.disciplines?.includes(mat)) {
                    const del = document.createElement('button');
                    del.className = 'delete-btn'; del.innerHTML = '×';
                    del.onclick = () => { if(confirm('Supprimer ?')) deleteDoc(docSnap.ref); };
                    li.appendChild(del);
                }
                ul.appendChild(li);
            });
        });
    });
  }

  // 6. UPLOAD CLOUDINARY
  window.up = (lvl, mat, type) => {
    const input = document.createElement('input'); 
    input.type = 'file';
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      const title = prompt("Titre du document :");
      if (!title) return;

      document.getElementById('loader-msg').style.display = 'block';
      const fd = new FormData();
      fd.append('file', file);
      fd.append('upload_preset', 'lfakm_ressources');

      try {
        const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', { method: 'POST', body: fd });
        const data = await res.json();
        
        await addDoc(collection(db, "ressources", viewingYear, `${lvl}-${mat}`, type), {
          titre: title,
          url: data.secure_url,
          date: serverTimestamp()
        });
      } catch (e) { alert("Erreur d'envoi"); }
      finally { document.getElementById('loader-msg').style.display = 'none'; }
    };
    input.click();
  };

  document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
