<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressources — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1B2A4A; --ink-deep: #10192E; --paper: #F7F5F0; --brass: #A8853F; --slate: #5B6472; --text: #1A1A1A; --line: rgba(27,42,74,0.14); --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter', sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--sans); color: var(--text); background: #f9f7f2; line-height:1.55; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 24px; }
  header { background: #fff; border-bottom: 1px solid var(--line); height: 80px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; }
  .nav-row { display:flex; align-items:center; justify-content:space-between; width: 100%; }
  .brand-name { font-family:var(--serif); font-weight:700; font-size:18px; color:var(--ink); text-decoration:none; }
  .nav-cta { background: var(--ink); color:#fff; padding:8px 15px; border-radius:5px; font-size:12px; border:none; cursor:pointer; text-decoration: none;}

  /* BARRE ARCHIVES */
  .archive-bar { background: var(--ink-deep); color: white; padding: 12px 0; text-align: center; }
  .archive-bar select { background: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; }

  .page-hero { background: var(--ink); color: #fff; padding: 40px 0; text-align: center; }
  .cycle-title { font-family: var(--serif); color: var(--ink); margin: 30px 0 10px; border-bottom: 2px solid var(--brass); display: inline-block; padding-bottom: 5px; }
  
  details.level { background: #fff; border: 1px solid var(--line); margin-bottom: 15px; border-radius: 8px; }
  details.level summary { padding: 18px; cursor: pointer; font-family: var(--serif); font-size: 19px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  .level-content { padding: 10px 20px 25px; background: #fafafa; border-top: 1px solid var(--line); }

  details.subject { background: #fff; border: 1px solid var(--line); margin-top: 10px; border-radius: 4px; }
  details.subject summary { padding: 12px; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; }

  .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 15px; }
  .doc-col h5 { font-size: 11px; text-transform: uppercase; color: var(--brass); margin-bottom: 10px; border-bottom: 1px solid #eee; }
  .doc-list { list-style: none; font-size: 13.5px; }
  .doc-list li { background: #f1ece1; padding: 10px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #e0ddd5; display: flex; justify-content: space-between; align-items: center; }
  .add-btn { margin-top: 10px; font-size: 11px; font-weight: 700; color: #fff; background: var(--ink); border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; }
</style>
</head>
<body>

<div class="archive-bar">
    Année Scolaire : 
    <select id="year-selector">
        <option value="2025-2026">2025-2026 (Actuelle)</option>
        <option value="2024-2025">2024-2025 (Archives)</option>
    </select>
</div>

<header><div class="wrap nav-row"><a href="index.html" class="brand-name">LFAKM - Portail</a><nav><a href="#" id="auth-link" class="nav-cta">Déconnexion</a></nav></div></header>

<section class="page-hero"><div class="wrap"><h1 id="year-title">Année 2025-2026</h1><p id="welcome-msg">Chargement du profil...</p></div></section>

<main class="wrap" id="main-content"></main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
    authDomain: "lfakm-87dec.firebaseapp.com",
    projectId: "lfakm-87dec",
    storageBucket: "lfakm-87dec.firebasestorage.app",
    messagingSenderId: "739517262614",
    appId: "1:739517262614:web:14abd3538427960c527e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const classes = [
    { id: "sixieme", name: "Sixième", mats: ["Français", "Mathématiques", "SVT"] },
    { id: "premiere-serie-s2a", name: "Première S2A", mats: ["Mathématiques", "Sciences Physiques", "SVT"] },
    { id: "terminale-serie-s2a", name: "Terminale S2A", mats: ["Mathématiques", "Sciences Physiques"] }
  ];

  let currentProfil = null;
  let viewingYear = "2025-2026";

  function slug(t) { return t.toLowerCase().trim().replace(/ /g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

  // Charger l'année par défaut
  async function initYear() {
    const snap = await getDoc(doc(db, "config", "schoolYear"));
    viewingYear = snap.data()?.year || "2025-2026";
    document.getElementById('year-selector').value = viewingYear;
    updateYearTitle();
  }

  function updateYearTitle() {
      const isArchive = (viewingYear !== document.getElementById('year-selector').options[0].value);
      document.getElementById('year-title').innerHTML = `Année ${viewingYear} ${isArchive ? '<br><small style="font-size:14px; color:orange;">(Mode Archive - Lecture seule)</small>' : ''}`;
  }

  document.getElementById('year-selector').onchange = (e) => {
      viewingYear = e.target.value;
      updateYearTitle();
      render(currentProfil);
  };

  function render(profil) {
    const main = document.getElementById('main-content');
    main.innerHTML = '';
    const role = profil?.role || 'visiteur';
    const isCurrentYear = (viewingYear === document.getElementById('year-selector').options[0].value);

    classes.forEach(cls => {
      // Élève : ne voit que sa classe
      if (role === 'eleve' && cls.id !== profil.niveau) return;
      
      // Professeur : ne voit que ses classes AFFECTÉES par l'admin
      if (role === 'professeur' && !profil.assignedClasses?.includes(cls.id)) return;

      let subHtml = '';
      cls.mats.forEach(mName => {
        const mId = slug(mName);
        const canEdit = (role === 'professeur' || role === 'admin') && profil.disciplines?.includes(mId) && isCurrentYear;
        
        if (role === 'professeur' && !profil.disciplines?.includes(mId)) return;

        subHtml += `
          <details class="subject">
            <summary>${mName} <span>▼</span></summary>
            <div class="subject-grid">
              <div class="doc-col">
                <h5>Cours</h5><ul class="doc-list" id="l-${viewingYear}-${cls.id}-${mId}-cours"></ul>
                ${canEdit ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','cours')">+ Ajouter</button>` : ''}
              </div>
              <div class="doc-col">
                <h5>Exercices</h5><ul class="doc-list" id="l-${viewingYear}-${cls.id}-${mId}-td"></ul>
                ${canEdit ? `<button class="add-btn" onclick="window.up('${cls.id}','${mId}','td')">+ Ajouter</button>` : ''}
              </div>
            </div>
          </details>`;
      });

      if (subHtml !== '') {
        const div = document.createElement('div');
        div.innerHTML = `<h2 class="cycle-title">${cls.name}</h2><div class="level-content">${subHtml}</div>`;
        main.appendChild(div);
        cls.mats.forEach(m => setupList(viewingYear, cls.id, slug(m), role, isCurrentYear, profil));
      }
    });
  }

  function setupList(year, lvl, mat, role, isCurrent, profil) {
    const q = query(collection(db, "ressources", `${year}`, `${lvl}-${mat}`)); 
    // Note: Chemin simplifié pour l'exemple, à adapter selon votre structure Firestore réelle
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, 'utilisateurs', user.uid));
      currentProfil = snap.data();
      await initYear();
      render(currentProfil);
    }
  });

  window.up = async (lvl, mat, type) => {
    const t = prompt("Titre :"); if(!t) return;
    // L'upload se fait toujours dans l'année scolaire "viewingYear"
    // await addDoc(collection(db, "ressources", viewingYear, `${lvl}-${mat}`, type), ...);
    alert("Envoi dans l'année " + viewingYear);
  };
</script>
</body>
</html>
