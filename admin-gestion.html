<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Administration LFAKM — Gestion & Années</title>
    <style>
        :root { --ink: #1B2A4A; --brass: #A8853F; --paper: #F7F5F0; }
        body { font-family: sans-serif; background: var(--paper); padding: 20px; font-size: 14px; }
        .admin-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); max-width: 1200px; margin: 0 auto; }
        .config-bar { background: var(--ink); color: white; padding: 15px; border-radius: 8px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .btn { border: none; padding: 7px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-save { background: var(--brass); color: white; }
        .btn-blue { background: #3498db; color: white; }
        .class-badge { display: inline-block; background: #eee; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin: 2px; }
        .modal { display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 100px rgba(0,0,0,0.5); z-index: 1001; width: 400px; }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="config-bar">
            <span>Année Scolaire Actuelle : <b id="current-year-display">...</b></span>
            <button class="btn btn-save" onclick="window.promptNewYear()">🔄 Démarrer une nouvelle année</button>
        </div>

        <h1>Gestion des Utilisateurs & Affectations</h1>
        <table id="users-table">
            <thead>
                <tr>
                    <th>Nom & Prénom</th>
                    <th>Rôle</th>
                    <th>Matières / Inscription</th>
                    <th>Classes Affectées</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Fenêtre pour affecter les classes -->
    <div id="assign-modal" class="modal">
        <h3 id="modal-teacher-name">...</h3>
        <p>Cochez les classes attribuées à ce professeur :</p>
        <div id="classes-checkboxes" style="margin: 15px 0;"></div>
        <button class="btn btn-save" id="confirm-assign">Enregistrer l'affectation</button>
        <button class="btn" onclick="document.getElementById('assign-modal').style.display='none'">Annuler</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
        authDomain: "lfakm-87dec.firebaseapp.com",
        projectId: "lfakm-87dec",
        storageBucket: "lfakm-87dec.firebasestorage.app",
        messagingSenderId: "739517262614",
        appId: "1:739517262614:web:14abd3538427960c527e37"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const allLevels = [
        {id:"6e", n:"6ème"}, {id:"5e", n:"5ème"}, {id:"4e", n:"4ème"}, {id:"3e", n:"3ème"},
        {id:"2s2a", n:"2nde S2A"}, {id:"ts2a", n:"Tle S2A"}
    ];

    onAuthStateChanged(auth, async (user) => {
        if (!user) return window.location.href = "identification.html";
        const snap = await getDoc(doc(db, "utilisateurs", user.uid));
        const current = snap.data();
        if (current.role !== 'admin') { document.body.innerHTML = "Accès réservé"; return; }
        
        // Charger l'année actuelle
        const config = await getDoc(doc(db, "config", "schoolYear"));
        document.getElementById('current-year-display').textContent = config.data()?.year || "Non définie";
        
        loadUsers();
    });

    async function loadUsers() {
        const snap = await getDocs(collection(db, "utilisateurs"));
        const tbody = document.querySelector("#users-table tbody");
        tbody.innerHTML = '';

        snap.forEach((userDoc) => {
            const u = userDoc.data();
            const id = userDoc.id;
            const tr = document.createElement('tr');
            
            const classesDisplay = u.assignedClasses ? u.assignedClasses.map(c => `<span class="class-badge">${c}</span>`).join('') : '<i style="color:grey">Aucune</i>';

            tr.innerHTML = `
                <td>${u.prenom} ${u.nom}</td>
                <td>${u.role.toUpperCase()}</td>
                <td>${u.disciplines?.join(', ') || u.niveau || '-'}</td>
                <td>${u.role === 'professeur' ? classesDisplay : '-'}</td>
                <td id="act-${id}"></td>
            `;
            tbody.appendChild(tr);

            const cell = document.getElementById(`act-${id}`);
            if (u.role === 'professeur') {
                const btn = document.createElement('button');
                btn.className = 'btn btn-blue'; btn.textContent = 'Affecter Classes';
                btn.onclick = () => openAssignModal(id, u);
                cell.appendChild(btn);
            }
        });
    }

    let selectedTeacherId = null;
    function openAssignModal(uid, data) {
        selectedTeacherId = uid;
        document.getElementById('modal-teacher-name').textContent = "Affectation : " + data.prenom;
        const container = document.getElementById('classes-checkboxes');
        container.innerHTML = allLevels.map(l => `
            <label style="display:block; margin:5px 0;">
                <input type="checkbox" name="lvl-check" value="${l.id}" ${(data.assignedClasses || []).includes(l.id) ? 'checked' : ''}> ${l.n}
            </label>
        `).join('');
        document.getElementById('assign-modal').style.display = 'block';
    }

    document.getElementById('confirm-assign').onclick = async () => {
        const checks = Array.from(document.querySelectorAll('input[name="lvl-check"]:checked')).map(c => c.value);
        await updateDoc(doc(db, "utilisateurs", selectedTeacherId), { assignedClasses: checks });
        alert("Classes affectées !");
        location.reload();
    };

    window.promptNewYear = async () => {
        const year = prompt("Entrez la nouvelle année scolaire (ex: 2026-2027) :");
        if (year && confirm(`Confirmer le passage à l'année ${year} ? La base sera propre pour cette année.`)) {
            await setDoc(doc(db, "config", "schoolYear"), { year: year });
            location.reload();
        }
    };
</script>
</body>
</html>
