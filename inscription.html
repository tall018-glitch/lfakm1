<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — LFAKM</title>
    <link rel="stylesheet" href="style.css"> <!-- Assurez-vous d'avoir votre CSS -->
    <style>
        :root { --ink: #1B2A4A; --brass: #A8853F; --paper: #F7F5F0; }
        body { font-family: sans-serif; background: var(--paper); padding: 20px; }
        .form-box { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--ink); text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .role-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .role-btn { flex: 1; padding: 10px; border: 1px solid var(--ink); cursor: pointer; text-align: center; border-radius: 5px; }
        .role-btn.active { background: var(--ink); color: white; }
        .hidden { display: none; }
        .subj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 13px; margin-top: 10px; }
        .btn-submit { width: 100%; background: var(--brass); color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Créer un compte</h2>
    <form id="signup-form">
        <div class="role-selector">
            <div id="btn-eleve" class="role-btn active" onclick="setRole('eleve')">Élève</div>
            <div id="btn-prof" class="role-btn" onclick="setRole('professeur')">Professeur</div>
        </div>

        <input type="text" id="prenom" placeholder="Prénom" required>
        <input type="text" id="nom" placeholder="Nom" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="pass" placeholder="Mot de passe" required>

        <!-- CHAMPS ELEVE -->
        <div id="fields-eleve">
            <select id="niveau">
                <option value="">Choisir votre classe...</option>
                <option value="sixieme">Sixième</option>
                <option value="cinquieme">Cinquième</option>
                <option value="quatrieme">Quatrième</option>
                <option value="troisieme">Troisième</option>
                <option value="seconde-serie-s2a">Seconde S2A</option>
                <option value="terminale-serie-s2a">Terminale S2A</option>
            </select>
        </div>

        <!-- CHAMPS PROFESSEUR -->
        <div id="fields-prof" class="hidden">
            <p>Matières enseignées :</p>
            <div class="subj-grid">
                <label><input type="checkbox" name="mats" value="mathematiques"> Mathématiques</label>
                <label><input type="checkbox" name="sciences-physiques"> Physique-Chimie</label>
                <label><input type="checkbox" name="sciences-de-la-vie-et-de-la-terre"> SVT</label>
                <label><input type="checkbox" name="francais"> Français</label>
                <label><input type="checkbox" name="anglais"> Anglais</label>
                <label><input type="checkbox" name="histoire-geo"> Histoire-Géo</label>
                <label><input type="checkbox" name="philosophie"> Philosophie</label>
                <label><input type="checkbox" name="arabe-tsq-arabe-et-redaction"> Arabe</label>
            </div>
        </div>

        <button type="submit" class="btn-submit">S'inscrire</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
        authDomain: "lfakm-87dec.firebaseapp.com",
        projectId: "lfakm-87dec",
        storageBucket: "lfakm-87dec.firebasestorage.app",
        messagingSenderId: "739517262614",
        appId: "1:739517262614:web:14abd3538427960c527e37"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentRole = 'eleve';

    window.setRole = (role) => {
        currentRole = role;
        document.getElementById('btn-eleve').classList.toggle('active', role === 'eleve');
        document.getElementById('btn-prof').classList.toggle('active', role === 'professeur');
        document.getElementById('fields-eleve').classList.toggle('hidden', role === 'professeur');
        document.getElementById('fields-prof').classList.toggle('hidden', role === 'eleve');
    }

    document.getElementById('signup-form').onsubmit = async (e) => {
        e.preventDefault();
        const prenom = document.getElementById('prenom').value;
        const nom = document.getElementById('nom').value;
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;

        try {
            const cred = await createUserWithEmailAndPassword(auth, email, pass);
            
            const userData = {
                prenom, nom, email, role: currentRole,
                creeLe: new Date().toISOString()
            };

            if(currentRole === 'eleve') {
                userData.niveau = document.getElementById('niveau').value;
            } else {
                const checks = document.querySelectorAll('input[name="mats"]:checked');
                userData.disciplines = Array.from(checks).map(cb => cb.value);
            }

            await setDoc(doc(db, "utilisateurs", cred.user.uid), userData);
            alert("Compte créé !");
            window.location.href = "ressources.html";
        } catch (err) { alert(err.message); }
    };
</script>
</body>
</html>
